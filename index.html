6:33", "Seek his kingdom first, and the rest finds its place."], "ko": ["Mateo 6:33", "먼저 그분의 나라를 구하십시오. 나머지는 제자리를 찾습니다."]}, {"es": ["Salmo 46:10", "Estad quietos. Hay días en que obedecer es parar, y recordar quién es Dios y quién no eres tú."], "en": ["Psalm 46:10", "Be still. Some days obedience is stopping and remembering who God is."], "ko": ["Salmo 46:10", "가만히 있으십시오. 순종은 때로 멈추어 하나님이 누구신지 기억하는 것입니다."]}, {"es": ["Gálatas 2:20", "Ya no vivo yo, vive Cristo en mí. La vida cristiana no es esfuerzo propio, es una vida entregada."], "en": ["Galatians 2:20", "Christ lives in me. The Christian life is surrender, not self-effort."], "ko": ["Gálatas 2:20", "그리스도께서 내 안에 사십니다. 그리스도인의 삶은 자기 노력이 아니라 드려진 삶입니다."]}, {"es": ["Josué 1:9", "Sé valiente, porque Dios te acompaña adonde vayas. El valor viene de su presencia, no de tus fuerzas."], "en": ["Joshua 1:9", "Be courageous: God goes with you. Courage comes from his presence."], "ko": ["Josué 1:9", "강하고 담대하십시오. 담대함은 그분의 임재에서 옵니다."]}, {"es": ["Lamentaciones 3:22-23", "Su misericordia no se acaba: es nueva cada mañana. Hoy empiezas sin deudas de ayer."], "en": ["Lamentations 3:22-23", "His mercies are new every morning. Begin today free of yesterday's debts."], "ko": ["Lamentaciones 3:22-23", "그분의 긍휼은 아침마다 새롭습니다. 어제의 빚 없이 오늘을 시작하십시오."]}, {"es": ["Efesios 2:8-9", "Salvos por gracia, no por obras. La gracia no te deja orgulloso ni desesperado: te deja agradecido."], "en": ["Ephesians 2:8-9", "Saved by grace, not works. Grace leaves you grateful, neither proud nor despairing."], "ko": ["Efesios 2:8-9", "은혜로 구원받았지 행위로가 아닙니다. 은혜는 우리를 교만도 절망도 아닌 감사로 이끕니다."]}, {"es": ["Hebreos 11:1", "La fe es confiar en lo que aún no se ve. Hoy da un paso pequeño de obediencia aunque no veas el final."], "en": ["Hebrews 11:1", "Faith trusts what is not yet seen. Take one small step of obedience today."], "ko": ["Hebreos 11:1", "믿음은 아직 보이지 않는 것을 신뢰하는 것입니다. 오늘 작은 순종의 한 걸음을 내디디십시오."]}, {"es": ["Santiago 1:5", "Si te falta sabiduría, pídela. Dios da con generosidad y no reprocha tu ignorancia."], "en": ["James 1:5", "If you lack wisdom, ask. God gives generously and does not scold."], "ko": ["Santiago 1:5", "지혜가 부족하면 구하십시오. 하나님은 후히 주시고 꾸짖지 않으십니다."]}, {"es": ["1 Juan 1:9", "Confesar es volver a la luz. Él es fiel para perdonar y limpiar: no hace falta esconderte."], "en": ["1 John 1:9", "Confession is returning to the light. He is faithful to forgive and cleanse."], "ko": ["1 Juan 1:9", "고백은 빛으로 돌아가는 것입니다. 그분은 신실하게 용서하고 깨끗하게 하십니다."]}, {"es": ["Salmo 119:105", "Su palabra es lámpara a tus pies. No alumbra todo el camino, pero alcanza para el siguiente paso."], "en": ["Psalm 119:105", "His word is a lamp for your feet: enough light for the next step."], "ko": ["Salmo 119:105", "주의 말씀은 내 발의 등불입니다. 다음 걸음을 비추기에 충분합니다."]}, {"es": ["Mateo 11:28", "Ven cansado. Jesús no pide primero que estés fuerte: ofrece descanso a quien llega con la carga."], "en": ["Matthew 11:28", "Come weary. Jesus offers rest to those who arrive carrying their burden."], "ko": ["Mateo 11:28", "지친 채로 오십시오. 예수님은 짐을 지고 온 이에게 쉼을 주십니다."]}, {"es": ["2 Corintios 12:9", "Su gracia te basta, y su poder se perfecciona en la debilidad. Tu límite es el lugar donde Él obra."], "en": ["2 Corinthians 12:9", "His grace is enough; his power is made perfect in weakness."], "ko": ["2 Corintios 12:9", "그분의 은혜가 충분합니다. 능력은 약함에서 온전해집니다."]}, {"es": ["Colosenses 3:23", "Haz todo como para el Señor. El trabajo común, hecho de corazón, también es adoración."], "en": ["Colossians 3:23", "Work as for the Lord. Ordinary work done from the heart is worship."], "ko": ["Colosenses 3:23", "주님께 하듯 일하십시오. 마음으로 하는 평범한 일도 예배입니다."]}, {"es": ["1 Tesalonicenses 5:16-18", "Alegría, oración y gratitud en toda circunstancia. No por todo lo que pasa, sino porque Dios sigue siendo Dios."], "en": ["1 Thessalonians 5:16-18", "Rejoice, pray and give thanks in every circumstance, because God remains God."], "ko": ["1 Tesalonicenses 5:16-18", "모든 상황에서 기뻐하고 기도하고 감사하십시오. 하나님은 여전히 하나님이십니다."]}, {"es": ["Miqueas 6:8", "Hacer justicia, amar misericordia y caminar humildemente. Tres cosas simples, y difíciles de sostener juntas."], "en": ["Micah 6:8", "Do justice, love mercy, walk humbly: simple things, hard to hold together."], "ko": ["Miqueas 6:8", "공의를 행하고 인자를 사랑하며 겸손히 걸으십시오. 단순하지만 함께 지키기 어렵습니다."]}, {"es": ["Salmo 139:23-24", "Pídele que examine tu corazón. Lo que Él muestra, lo muestra para sanar, no para condenar."], "en": ["Psalm 139:23-24", "Ask him to search your heart. What he shows, he shows to heal."], "ko": ["Salmo 139:23-24", "그분께 마음을 살펴 달라고 구하십시오. 보이시는 것은 치유를 위함입니다."]}, {"es": ["Juan 15:5", "Separados de Cristo nada podemos hacer. Permanecer en Él es la raíz de cualquier fruto duradero."], "en": ["John 15:5", "Apart from Christ we can do nothing. Abiding in him is the root of lasting fruit."], "ko": ["Juan 15:5", "그리스도를 떠나서는 아무것도 할 수 없습니다. 그분 안에 거함이 열매의 뿌리입니다."]}, {"es": ["Romanos 12:2", "No te amoldes al mundo: sé transformado. El cambio empieza cuando la mente se renueva con la verdad."], "en": ["Romans 12:2", "Do not conform to the world; be transformed by a mind renewed in truth."], "ko": ["Romanos 12:2", "세상을 본받지 말고 진리로 마음을 새롭게 하여 변화를 받으십시오."]}, {"es": ["Eclesiastés 3:1", "Todo tiene su tiempo. Hoy confía en que el tiempo de Dios no llega tarde, aunque a ti te parezca lento."], "en": ["Ecclesiastes 3:1", "There is a time for everything. God's timing is never late."], "ko": ["Eclesiastés 3:1", "모든 일에는 때가 있습니다. 하나님의 때는 결코 늦지 않습니다."]}, {"es": ["Mateo 5:14-16", "Eres luz. Hoy deja que alguien vea tu fe en una acción concreta, no solo en tus palabras."], "en": ["Matthew 5:14-16", "You are light. Let someone see your faith in a concrete act today."], "ko": ["Mateo 5:14-16", "당신은 빛입니다. 오늘 구체적인 행동으로 믿음을 보이십시오."]}, {"es": ["Salmo 121:1-2", "El socorro viene del Señor, creador del cielo y la tierra. Levanta la mirada más allá del problema."], "en": ["Psalm 121:1-2", "Help comes from the Lord, maker of heaven and earth. Look beyond the problem."], "ko": ["Salmo 121:1-2", "도움은 천지를 지으신 여호와께로부터 옵니다. 문제 너머를 바라보십시오."]}, {"es": ["Apocalipsis 21:4", "Dios enjugará toda lágrima. La esperanza cristiana no ignora el dolor: lo atraviesa y promete terminarlo."], "en": ["Revelation 21:4", "God will wipe away every tear. Christian hope passes through pain and promises its end."], "ko": ["Apocalipsis 21:4", "하나님이 모든 눈물을 닦아 주실 것입니다. 소망은 고통을 지나 그 끝을 약속합니다."]}, {"es": ["Judas 24-25", "Dios es poderoso para guardarte. Si sostenerte dependiera de ti, caerías; depende de Él."], "en": ["Jude 24-25", "God is able to keep you. If holding on depended on you, you would fall; it depends on him."], "ko": ["Judas 24-25", "하나님은 당신을 지키실 수 있습니다. 붙드는 일이 당신께 달렸다면 넘어지겠지만, 그분께 달려 있습니다."]}, {"es": ["Salmo 51:10", "Crea en mí un corazón limpio. A veces la oración más honesta es pedir que Dios haga lo que tú no puedes."], "en": ["Psalm 51:10", "Create in me a clean heart: sometimes the most honest prayer asks God to do what we cannot."], "ko": ["Salmo 51:10", "내 안에 정한 마음을 창조하소서. 가장 정직한 기도는 우리가 못 하는 일을 구하는 것일 때가 있습니다."]}, {"es": ["Números 6:24-26", "Que el Señor te bendiga y te guarde. Cierra el mes recibiendo esa bendición y llevándola a otros."], "en": ["Numbers 6:24-26", "The Lord bless you and keep you. Close the month receiving that blessing and sharing it."], "ko": ["Números 6:24-26", "여호와께서 네게 복을 주시고 지켜 주시기를 원합니다. 이 복을 받고 다른 이에게 전하며 한 달을 마무리하십시오."]}], "st": [{"es": ["Soteriología", "## Introducción\nLa soteriología estudia cómo Dios salva al pecador. La pregunta central es quién hace la obra: la Escritura responde que la salvación pertenece al Señor (Jon 2:9) y que es completa en Cristo.\n## 1. Elección\nDios escogió a su pueblo en Cristo antes de la fundación del mundo, no por méritos previstos sino por su beneplácito (Ef 1:4-6; Ro 8:29-30). La elección no anula la responsabilidad humana: el evangelio se ofrece a todos y llama a todos al arrepentimiento (Hch 17:30).\n## 2. Llamado eficaz y nuevo nacimiento\nEl pecador está muerto en sus delitos (Ef 2:1-5). Solo el Espíritu da vida, por eso Jesús dice que hay que nacer de nuevo (Jn 3:3-8). Dios abre el corazón (Hch 16:14) y la fe brota como respuesta.\n## 3. Justificación\nDios declara justo al creyente por la fe sola, porque la justicia de Cristo se le atribuye (Ro 3:21-28; 2 Co 5:21). No es un proceso, es un veredicto, y trae paz con Dios (Ro 5:1).\n## 4. Santificación\nQuien fue justificado es también transformado por el Espíritu (Ro 8:13; Fil 2:12-13). La santificación es real y progresiva, pero nunca perfecta en esta vida. Las obras no producen la salvación, la evidencian (Stg 2:17).\n## 5. Perseverancia y glorificación\nDios termina lo que empieza (Fil 1:6; Jn 10:27-29). Los santos perseveran porque Dios los guarda, y el camino termina en glorificación (Ro 8:30).\n## Aplicación\nSi tu seguridad dependiera de ti, caerías; depende de Cristo. Eso produce humildad, porque todo es gracia, y gratitud, y empuja a la santidad y al evangelismo.\n## Para reflexionar\n1. ¿Qué parte de tu vida cristiana intentas sostener con esfuerzo propio?\n2. ¿Cómo cambia tu forma de evangelizar saber que Dios es quien da vida?\n3. ¿Qué diferencia hay entre justificación y santificación, y por qué importa no mezclarlas?", "Ef 2:1-10 · Ro 8:29-30 · Fil 1:6"], "en": ["Soteriology", "## Introduction\nSoteriology studies how God saves sinners. The central question is who does the work: Scripture answers that salvation belongs to the Lord (Jonah 2:9) and is complete in Christ.\n## 1. Election\nGod chose his people in Christ before the foundation of the world, not for foreseen merit but according to his good pleasure (Eph 1:4-6; Rom 8:29-30). Election does not cancel human responsibility: the gospel is offered to all and calls everyone to repent (Acts 17:30).\n## 2. Effectual calling and new birth\nThe sinner is dead in trespasses (Eph 2:1-5). Only the Spirit gives life, which is why Jesus says we must be born again (John 3:3-8). God opens the heart (Acts 16:14) and faith springs up in response.\n## 3. Justification\nGod declares the believer righteous by faith alone, because Christ's righteousness is credited to him (Rom 3:21-28; 2 Cor 5:21). It is not a process but a verdict, and it brings peace with God (Rom 5:1).\n## 4. Sanctification\nThe justified are also transformed by the Spirit (Rom 8:13; Phil 2:12-13). Sanctification is real and progressive, yet never perfect in this life. Works do not produce salvation; they give evidence of it (James 2:17).\n## 5. Perseverance and glorification\nGod finishes what he begins (Phil 1:6; John 10:27-29). The saints persevere because God keeps them, and the road ends in glorification (Rom 8:30).\n## Application\nIf your security depended on you, you would fall; it depends on Christ. This produces humility, since all is grace, and gratitude, and it pushes toward holiness and evangelism.\n## For reflection\n1. What part of your Christian life are you trying to hold up by your own effort?\n2. How does knowing God is the one who gives life change the way you share the gospel?\n3. What is the difference between justification and sanctification, and why does it matter not to mix them?", "Eph 2:1-10 · Rom 8:29-30 · Phil 1:6"], "ko": ["구원론", "## 서론\n구원론은 하나님이 죄인을 어떻게 구원하시는지를 다룹니다. 핵심 질문은 누가 그 일을 하시느냐입니다. 성경은 구원이 여호와께 속하며(욘 2:9) 그리스도 안에서 완전하다고 답합니다.\n## 1. 선택\n하나님은 세상이 창조되기 전에 그리스도 안에서 자기 백성을 택하셨습니다. 미리 보신 공로 때문이 아니라 그분의 기뻐하시는 뜻 때문입니다(엡 1:4-6; 롬 8:29-30). 선택은 인간의 책임을 없애지 않습니다. 복음은 모든 사람에게 제시되고 모두에게 회개를 명합니다(행 17:30).\n## 2. 유효한 부르심과 중생\n죄인은 허물로 죽어 있습니다(엡 2:1-5). 오직 성령만이 생명을 주십니다. 그래서 예수님은 거듭나야 한다고 하셨습니다(요 3:3-8). 하나님이 마음을 여시고(행 16:14) 믿음이 응답으로 일어납니다.\n## 3. 칭의\n하나님은 그리스도의 의가 전가되므로 오직 믿음으로 신자를 의롭다 선언하십니다(롬 3:21-28; 고후 5:21). 칭의는 과정이 아니라 선언이며 하나님과의 화평을 가져옵니다(롬 5:1).\n## 4. 성화\n의롭다 함을 받은 사람은 성령으로 변화됩니다(롬 8:13; 빌 2:12-13). 성화는 실제적이고 점진적이지만 이 땅에서는 완전하지 않습니다. 행위는 구원을 만들지 않고 구원을 증거합니다(약 2:17).\n## 5. 견인과 영화\n하나님은 시작하신 일을 마치십니다(빌 1:6; 요 10:27-29). 성도는 하나님이 지키시기에 견디며, 그 길은 영화로 끝납니다(롬 8:30).\n## 적용\n안전이 당신께 달렸다면 넘어졌을 것입니다. 그것은 그리스도께 달려 있습니다. 이것은 모든 것이 은혜이기에 겸손을, 그리고 감사를 낳고 거룩함과 전도로 이끕니다.\n## 묵상 질문\n1. 신앙생활의 어떤 부분을 자기 노력으로 붙들려 하고 있습니까?\n2. 생명을 주시는 분이 하나님이심을 아는 것이 복음 전하는 방식을 어떻게 바꿉니까?\n3. 칭의와 성화의 차이는 무엇이며, 왜 둘을 섞지 않는 것이 중요합니까?", "엡 2:1-10 · 롬 8:29-30 · 빌 1:6"]}, {"es": ["Eclesiología", "La iglesia es el pueblo que Dios llama y reúne en torno a su Palabra. Sus marcas, según la tradición reformada, son la predicación fiel, la correcta administración del bautismo y la Cena, y la disciplina.", "Mt 16:18 · Hch 2:42 · Ef 4:11-16"], "en": ["Ecclesiology", "The church is the people God calls and gathers around his Word. Its marks, in the Reformed tradition, are faithful preaching, right administration of baptism and the Lord's Supper, and discipline.", "Matt 16:18 · Acts 2:42 · Eph 4:11-16"], "ko": ["교회론", "교회는 하나님이 부르시고 그분의 말씀 둘레에 모으신 백성입니다. 개혁주의 전통에서 교회의 표지는 충실한 말씀 선포, 세례와 성찬의 바른 시행, 그리고 권징입니다.", "마 16:18 · 행 2:42 · 엡 4:11-16"]}, {"es": ["Escatología futurista", "Esta lectura espera un cumplimiento futuro de Apocalipsis 4–22 y de las profecías de Daniel: tribulación, retorno visible de Cristo y reino. Llama a la vigilancia y la santidad, no a calcular fechas.", "Dn 9:24-27 · Mt 24 · Ap 19–22"], "en": ["Futurist eschatology", "This reading expects a future fulfillment of Revelation 4–22 and Daniel's prophecies: tribulation, Christ's visible return and the kingdom. It calls for watchfulness and holiness, not date-setting.", "Dan 9:24-27 · Matt 24 · Rev 19–22"], "ko": ["미래주의 종말론", "이 해석은 요한계시록 4–22장과 다니엘서 예언의 미래적 성취를 기대합니다: 환난, 그리스도의 가시적 재림, 그리고 왕국. 날짜 계산이 아니라 깨어 있음과 거룩함을 촉구합니다.", "단 9:24-27 · 마 24 · 계 19–22"]}, {"es": ["Teología reformada", "Soli Deo gloria. Las cinco solas (Escritura, gracia, fe, Cristo, gloria de Dios) y las doctrinas de la gracia resumen su énfasis en la soberanía de Dios. Dentro de la tradición se debaten puntos como el alcance de la expiación.", "Ro 9 · Jn 6:37-44 · Ef 1:3-14"], "en": ["Reformed theology", "Soli Deo gloria. The five solas (Scripture, grace, faith, Christ, God's glory) and the doctrines of grace summarize its emphasis on God's sovereignty. Points such as the extent of the atonement are debated within the tradition.", "Rom 9 · John 6:37-44 · Eph 1:3-14"], "ko": ["개혁신학", "오직 하나님께 영광. 다섯 솔라(성경, 은혜, 믿음, 그리스도, 하나님의 영광)와 은혜의 교리는 하나님의 주권에 대한 강조를 요약합니다. 속죄의 범위 같은 문제는 전통 안에서도 논쟁됩니다.", "롬 9 · 요 6:37-44 · 엡 1:3-14"]}, {"es": ["Doctrinas fundamentales", "La Escritura inspirada y suficiente, un solo Dios en tres personas, la deidad y humanidad de Cristo, su muerte expiatoria, su resurrección corporal y su regreso. Son la base común de la fe cristiana histórica.", "2 Ti 3:16 · Mt 28:19 · Jn 1:1-14 · 1 Co 15:3-4"], "en": ["Fundamental doctrines", "Inspired and sufficient Scripture, one God in three persons, the deity and humanity of Christ, his atoning death, bodily resurrection and return. These are the common ground of historic Christian faith.", "2 Tim 3:16 · Matt 28:19 · John 1:1-14 · 1 Cor 15:3-4"], "ko": ["기본 교리", "영감되고 충족한 성경, 삼위일체 하나님, 그리스도의 신성과 인성, 대속의 죽음, 몸의 부활과 재림. 이것들은 역사적 기독교 신앙의 공통 기반입니다.", "딤후 3:16 · 마 28:19 · 요 1:1-14 · 고전 15:3-4"]}, {"es": ["Cristología", "Jesucristo es verdadero Dios y verdadero hombre en una sola persona. Vivió la obediencia que nosotros no pudimos, murió en lugar del pecador y resucitó con poder.", "Jn 1:1-14 · Fil 2:5-11 · Col 1:15-20"], "en": ["Christology", "Jesus Christ is truly God and truly man in one person. He lived the obedience we could not, died in the sinner's place and rose in power.", "John 1:1-14 · Phil 2:5-11 · Col 1:15-20"], "ko": ["기독론", "예수 그리스도는 한 인격 안에서 참 하나님이시며 참 사람이십니다. 우리가 할 수 없던 순종을 사시고, 죄인을 대신해 죽으셨으며, 능력으로 부활하셨습니다.", "요 1:1-14 · 빌 2:5-11 · 골 1:15-20"]}, {"es": ["Pneumatología", "El Espíritu Santo es Dios: regenera, sella al creyente, ilumina la Escritura y produce fruto. Habita en cada creyente y lo capacita para la santidad.", "Jn 16:13-14 · Ro 8:9-16 · Gá 5:22-23"], "en": ["Pneumatology", "The Holy Spirit is God: he regenerates, seals the believer, illumines Scripture and produces fruit. He dwells in every believer and empowers holiness.", "John 16:13-14 · Rom 8:9-16 · Gal 5:22-23"], "ko": ["성령론", "성령은 하나님이십니다. 중생시키시고, 신자를 인치시며, 성경을 밝히시고, 열매를 맺게 하십니다. 모든 신자 안에 거하시며 거룩함을 가능하게 하십니다.", "요 16:13-14 · 롬 8:9-16 · 갈 5:22-23"]}, {"es": ["Bibliología", "La Escritura es la Palabra inspirada de Dios, suficiente y autoridad final en fe y conducta. Se interpreta en su contexto, con los textos originales como base.", "2 Ti 3:16-17 · 2 P 1:20-21 · Sal 119"], "en": ["Bibliology", "Scripture is God's inspired Word, sufficient and the final authority in faith and conduct. It is interpreted in context, with the original texts as the foundation.", "2 Tim 3:16-17 · 2 Pet 1:20-21 · Ps 119"], "ko": ["성경론", "성경은 하나님의 영감된 말씀이며 충족하고 신앙과 행위의 최종 권위입니다. 문맥 안에서, 원어 본문을 토대로 해석합니다.", "딤후 3:16-17 · 벧후 1:20-21 · 시 119"]}, {"es": ["Trinidad", "Un solo Dios eterno en tres personas, Padre, Hijo y Espíritu Santo, iguales en esencia y distintas en persona.", "Dt 6:4 · Mt 28:19 · 2 Co 13:14"], "en": ["The Trinity", "One eternal God in three persons, Father, Son and Holy Spirit, equal in essence and distinct in person.", "Deut 6:4 · Matt 28:19 · 2 Cor 13:14"], "ko": ["삼위일체", "한 분이신 영원한 하나님이 성부, 성자, 성령 세 위격으로 계시며, 본질에서 동등하고 위격에서 구별됩니다.", "신 6:4 · 마 28:19 · 고후 13:14"]}, {"es": ["Pecado y ser humano", "El ser humano fue creado a imagen de Dios y cayó en Adán. El pecado alcanza a toda la persona, y solo la gracia de Dios la restaura.", "Gn 1:26-27 · Ro 5:12-19 · Sal 51:5"], "en": ["Humanity and sin", "Humanity was created in God's image and fell in Adam. Sin touches the whole person, and only God's grace restores it.", "Gen 1:26-27 · Rom 5:12-19 · Ps 51:5"], "ko": ["인간과 죄", "인간은 하나님의 형상으로 창조되었으나 아담 안에서 타락했습니다. 죄는 전인에 미치며 오직 하나님의 은혜만이 회복시킵니다.", "창 1:26-27 · 롬 5:12-19 · 시 51:5"]}], "books": [{"id": "desierto", "t": {"es": "Del desierto a la fuente", "en": "From the Desert to the Fountain", "ko": "사막에서 샘으로"}, "d": {"es": "La lámpara encendida: conversaciones de sobremesa sobre la vida, la muerte y lo que viene después.", "en": "The lamp is lit: after-dinner conversations about life, death and what comes after.", "ko": "켜진 등불: 삶과 죽음, 그리고 그 이후에 대한 식탁의 대화."}, "ch": [{"t": "Prólogo: La lámpara y el camino", "x": "Empiezo por donde duele, porque es donde empieza casi todo lo que vale la pena decir. Hay quien escribe sobre el dolor desde lejos, con la elegancia de quien lo estudió en libros. Y hay quien lo escribe desde adentro, con la torpeza de quien todavía lo lleva puesto. Un anglicano hizo lo segundo cuando perdió a su mujer, y dejó unas libretas donde se observa a sí mismo sufrir, casi como quien observa el clima: sin ordenar nada, sin fingir nada, preguntando lo que no se atrevería a preguntar en voz alta. Yo, que soy de otra tradición, las leí un día con la sensación de que alguien había abierto mi propia casa. Me dije: no puede ser, otro hombre pasó por lo mismo, y de otro modo. Aquella lectura me enseñó que se puede creer y temblar a la vez, y que la fe no es la ausencia del temblor, sino lo que sigue en pie mientras se tiembla.\n\nMi pareja murió hace tres años. No hace falta que escriba aquí más de lo que ya sabes: que hubo una mano que se quedó en la mía, que hubo un umbral que cruzó creyendo, y que a mí me tocó, siendo ministro, predicar en su propio funeral. Eso lo contaré a su tiempo, en el lugar que le corresponde, sin hacerlo el negocio de todo el libro. Su camino terminó y su estación quedó atrás, pero yo sigo sobre el terreno. Todavía tengo cosas que contar, y mientras haya cosas que contar, hay que seguir contándolas.\n\nEste libro tiene un recorrido, y conviene que lo sepas desde ahora. Va del desierto a la fuente. El desierto es donde uno se queda cuando se acaba lo que creía tener: la salud, el amor, la certeza, las palabras. La fuente es lo que hay al otro lado, y no es una metáfora cómoda: es una Persona que se ofrece de balde. Entre uno y otra no hay atajo. Hay camino, y el camino se hace despacio.\n\nUn poeta antiguo empieza su viaje confesando que, a la mitad de la vida, se halló en una selva oscura, porque había perdido la senda recta. Es una de las frases más honestas de la literatura: no dice que se perdió por maldad ni por tontería, sino que un día, sin saber cómo, estaba adentro. Muchos estamos o hemos estado ahí. Ese poeta recorre después el abismo, la montaña y el cielo, guiado primero por un hombre sabio y después por una mujer que lo conduce a la luz. Yo no pretendo hacerme una Comedia, ni sería capaz. Pero tomo prestada su forma como se toma una lámpara: para alumbrar un camino que ya existe.\n\nPorque hay una fuente. Dios mismo se llama así por boca de un profeta, cuando se queja de que su pueblo lo dejó a Él, manantial de aguas vivas, para cavarse cisternas rotas que no retienen agua. Y el último libro de la Biblia termina con una invitación abierta: el que tenga sed, venga y beba del agua de la vida de balde. Entre aquella queja y esta invitación cabe toda la historia. Y cabe, si me lo permites, este libro.\n\nEs de noche mientras escribo. Es un martes cualquiera, de esos que no figuran en ningún calendario ni recordará nadie. Hay una lámpara encendida y el día, con su ruido, por fin se ha retirado. En ese silencio uno se pone a meditar. A hablar un poco con Él, a hablar un poco consigo mismo, a hablar con otros que ya no están, pensando en uno y pensando en todo, pensando en Él, que es el todo.\n\nPienso en los que ya vivieron lo que vivimos. En los que lo transitaron y salieron del otro lado, cojeando o cantando, y en los que todavía están en medio del camino. Pienso en los que pueden decirte con autoridad: mira, ese sendero no te conviene, y lo dicen no porque lo hayan leído, sino porque se les rompieron los zapatos en él. La experiencia sabe hablar. No grita, no presume y no siempre tiene razón, pero habla con la voz de quien pagó por saber lo que sabe.\n\nLa Escritura distingue dos maneras de recibir esa voz. Reprende al sabio, dice el libro de los Proverbios, y te amará; reprende al necio, y te aborrecerá. El sabio, cuando lo corrige otro sabio, se queda agradecido. El necio se queda ofendido. Y de esa diferencia, más que de la inteligencia o de los años, depende casi todo en la vida.\n\nPor eso quiero advertirte desde la primera página: este no es un libro para todos, ni lo pretende. Es una conversación, no un tratado de apologética. Quien busque aquí un duelo de argumentos encontrará más bien una charla. Para la disputa abierta ya existe otro libro, Obsidiana, que es público y puede buscarse. Este no discute: conversa. No quiere vencerte; quiere sentarse a tu lado. Y si no te sirve, seguramente hay otros libros en esta misma estantería, más amenos, que te harán mejor compañía.\n\nHablaremos de la vida y de la muerte. De las edades del hombre, de cómo se menosprecia al anciano y de cómo se descuida al adolescente. Hablaremos del corazón, que es donde todo empieza y donde todo se complica, y de lo que hacen los cristianos cuando ya no saben qué decir. Hablaremos de los cuatro amores y de la jaula de los miedos, de la fe y de la credulidad, del ateísmo de los que creen en Dios sin contar con Él, del silencio que muchos no soportan, del perdón, de la oración y de cómo se le habla a un alma rota.\n\nHay en este libro algo de las viejas cartas de un hombre a un amigo, ese amigo que quizá fuera otro y quizá fuera él mismo. Hay algo de las charlas de sobremesa, cuando la mesa ya se levantó y quedan el pan, la lámpara y las ganas de seguir hablando. Y hay algo de lo que aprendí leyendo a cuatro gigantes: la paradoja que despierta, la lógica que no se deja engañar, el corazón que sabe lo que la cabeza ignora y la hondura del alma que se mira a sí misma delante de Dios. No los traigo como invitados con nombre. Traigo su manera de pensar, que me prestaron sin saberlo. Cuando cite algo, lo diré con mis palabras, y quien quiera ir a las fuentes que vaya: valen la pena.\n\nPero este libro es mío, y es mío porque hablo desde donde he estado. He sido pastor y líder; salgo a predicar y a ministrar. Vengo de las Asambleas de Dios y me reconozco reformado y pentecostal: creo en los dones del Espíritu Santo y creo que la Iglesia\n\nnecesita volver siempre a la Escritura. Leo hebreo, me sé de memoria buena parte de la Reina-Valera y llevo el nombre de Dios tatuado en el brazo, como quien se obliga a no olvidar de quién es. Y he cruzado un desierto. No lo cuento para impresionarte, sino porque nadie debería hablarle del agua al sediento si nunca pasó sed.\n\nAllí donde los cristianos discrepamos, diré cuál es mi lectura, y la diré como mía, para que no se confunda con el texto. Eso no la debilita: la vuelve honesta.\n\nDijo Jesús que hay que hacer las obras mientras dura el día, porque viene la noche, cuando nadie puede trabajar. Ese es el núcleo de cada jornada: la luz, hasta que se apague. Mientras tanto, la lámpara está encendida. Acércate."}, {"t": "Preludio: El desierto", "x": "Antes de contarte nada, déjame ponerte donde yo estuve.\n\nImagina una llanura sin sombra. No hay árboles, no hay casas, no hay camino marcado. El sol no calienta: castiga. Llevas en la espalda lo poco que te quedó y en el pecho una pregunta que no sabes decir. Alrededor, el mismo paisaje en todas las direcciones, de modo que caminar al este o al oeste da igual, porque no hay nada que te diga que avanzas. Eso es un desierto. No es un castigo ni un error de cálculo: es el lugar donde se acaban las cosas que uno tomaba por suyas.\n\nLa Biblia está llena de desiertos, y no por casualidad. Allí llegó Agar, echada de casa, y descubrió que había un Dios que la veía. Allí huyó Moisés y allí volvió, cuarenta años después, con una zarza ardiendo. Allí anduvo un pueblo entero, y el pan le caía del cielo cada mañana, ni un día de más, para que aprendiera a pedirlo. Allí se retiró Elías, y allí fue llevado Jesús mismo, antes de empezar. Ninguno fue al desierto por gusto. Todos salieron distintos.\n\nEs que el desierto hace una cosa que nada más hace: te quita el ruido. Sin ruido, uno oye por primera vez lo que lleva dentro. A veces es un lamento. A veces es una vieja rabia. A veces, para sorpresa de quien lo vive, es una voz suave que no estaba antes, o que estaba y no se la oía. Por eso los antiguos decían que Dios lleva al desierto a quien quiere hablar con él a solas.\n\nLeí una vez una alegoría, o mejor dicho me la inventé de tanto pensarla, y quiero dejártela aquí como preludio de todo lo que sigue. Un viajero cruza un desierto con un cántaro de barro. Al principio el cántaro está lleno y el viajero, orgulloso, lo presume. Con los días, el agua baja. Al llegar a la mitad del desierto está medio vacío, y el viajero lo mira con rabia, como si el cántaro lo hubiera traicionado. A las dos terceras partes ya no queda una gota.\n\nEntonces, sin nada que cuidar, sin nada que presumir, el viajero sube una duna y, desde arriba, ve a lo lejos una línea verde. No era un espejismo. Era un río. Y comprende, con una claridad que lo avergüenza, que el cántaro nunca fue su fuente: era solo el vaso para beber de ella.\n\nEse es el mapa del libro. Empezaremos en el desierto, que es donde la mayoría de nosotros vive o ha vivido. Pasaremos por el jardín del principio y por la grieta que lo rompió. Caminaremos por las edades del hombre. Aprenderemos a hablar a otros y a callar con ellos. Y llegaremos, si Dios quiere, adonde llega el viajero: a la orilla.\n\nAhora sí. Empecemos."}, {"t": "Capítulo 1 · El jardín", "x": "Y vio Dios todo lo que había hecho, y he aquí que era bueno en gran manera.\n\n— Génesis 1:31\n\nEmpecemos por el principio, que es donde empieza todo lo que importa.\n\nEl primer versículo de la Biblia no dice que al principio había un problema. Dice que al principio Dios creó los cielos y la tierra. En esa frase, tan breve que un niño la aprende en una tarde, cabe un universo pequeño: bereshit, «en el principio», es el tiempo; Elohim, Dios, es el que ya estaba antes de que hubiera tiempo; hashamayim ve-et ha-aretz, «los cielos y la tierra», es el espacio con todo lo que lo llena. Tiempo, espacio y materia empiezan juntos, y quien los hace no está dentro de ellos. Quien diga que el Génesis es un cuento debería reconocer, al menos, que es un cuento que arranca exactamente donde la cosmología moderna terminó descubriendo que hubo un comienzo.\n\n—Pero tú no estarás diciendo que la ciencia pruebe a Dios —dirás.\n\nNo lo digo. La ciencia mide lo que se puede medir, y lo mide admirablemente. Lo que digo es que quien pregunta por qué hay algo y no nada ha formulado una pregunta que ningún microscopio contesta, y que quien la desprecia no la ha respondido: la ha dejado de lado.\n\nTampoco la conciencia se pesa en una balanza, y sin embargo nadie duda de que existe. Un hombre llora, desea, se indigna, ama. Nada de eso es oxígeno ni hidrógeno, y es lo más real que hay.\n\nEl segundo versículo muestra una tierra tohu wabohu: informe y vacía. No hablemos aquí de entropía, que es una palabra del siglo diecinueve y puede llevarnos a leer física moderna en un texto antiguo. Digamos lo que el texto dice. Había algo sin forma, y la Palabra le dio forma. Dios dijo, y fue. Separó, nombró, ordenó. Y cada vez que termina una obra, el texto repite casi con asombro que era bueno. Hasta que llega al hombre, y entonces ya no dice «bueno», sino «bueno en gran manera».\n\nAsí debía ser todo. No un sistema, sino un jardín. No una máquina, sino una casa. Un hombre y una mujer que conocían a su Creador sin miedo y sin vergüenza; un trabajo que no agotaba porque era vocación; una amistad con Dios al fresco del día, caminando. Cada criatura miraba a su Hacedor como el girasol mira al sol, sin esfuerzo, porque para eso estaba hecha. No hacía falta fe, porque la presencia era inmediata. No hacía falta política, porque nadie dominaba. No hacía falta ley, porque el amor era la ley.\n\nCompara esto con lo que enseña casi todo el mundo antiguo, y buena parte del moderno. Para muchos pueblos, el mundo nació de una pelea entre dioses y el hombre fue hecho de sobras, para servirles de esclavo. Para el pensamiento actual más difundido, el mundo es un accidente sin autor y el hombre una coincidencia sin destino. Entre el hombre-esclavo y el hombre-accidente, el Génesis pone al hombre-hijo: a imagen de Dios, hecho a propósito, colocado en un jardín. No es un detalle poético. Es lo que decide si la vida humana vale algo o no.\n\nImagina un músico que compone una pieza para un instrumento que todavía no existe, y después manda construir el instrumento para que la toque. Así es el hombre en el jardín: no un invento que luego buscó para qué servir, sino un instrumento hecho a la medida de una música que ya estaba escrita. Por eso, cuando suena mal, lo notamos. Lo notamos porque, en el fondo, sabemos cómo debería sonar.\n\nQuiero que retengas una sola cosa de este capítulo, porque el resto del libro depende de ella: el mundo no empezó roto. Lo que ves de malo en él no es lo original. El mal es una intrusión, no un cimiento. Y de ahí que el cristianismo diga, a la vez, dos cosas que casi ninguna otra visión del mundo se atreve a decir juntas: que el mundo es bueno y que algo ha salido terriblemente mal. Quien dice solo lo primero es un ingenuo. Quien dice solo lo segundo es un cínico. Solo quien las dice juntas puede llamarse cuerdo.\n\nHay todavía otra cosa en ese jardín que conviene mirar de cerca, porque suele pasar inadvertida: el hombre tenía trabajo. Antes de que hubiera pecado, antes de que hubiera sudor, Dios lo puso en el huerto para que lo labrara y lo guardara. El trabajo no nació como castigo, sino como una forma de compañía. Dios, que había creado, invitó a su criatura a crear con Él: le trajo los animales para ver cómo los llamaría, y lo que el hombre dijera, eso\n\nsería su nombre. Poner nombre es un acto de señorío y de ternura. Es decir: «tú eres esto, y yo te reconozco». Hay en esa escena un Dios que no tiene prisa y que deja a su hijo participar en la obra.\n\nY hay también un descanso. Al séptimo día, dice el texto, Dios reposó. No porque estuviera cansado, sino para enseñarnos que el mundo no se sostiene sobre nuestras fatigas. El sábado es lo contrario de la prisa: es el día en que uno aprende que puede parar sin que el universo se derrumbe. Qué difícil se nos ha vuelto esa lección. Vivimos como si fuéramos nosotros los que mantienen el sol en el cielo.\n\nDéjame proponerte una alegoría. Imagina un hombre al que su padre, antes de morir, le dejó un mapa. No era un mapa de tesoros enterrados, sino de una casa grande, con muchas habitaciones, un huerto, un pozo y una mesa larga en la que siempre había un lugar vacío con su nombre. El hombre perdió el mapa en un viaje, y con el tiempo se olvidó de que alguna vez lo tuvo. Vivió en posadas, en estaciones, en casas ajenas, siempre con la vaga sensación de que algo faltaba. Hasta que un día, en una calle cualquiera, un desconocido le dijo: «Sé dónde está la casa de tu padre». Y el hombre, sin saber por qué, rompió a llorar. Había oído nombrar lo que su corazón nunca había dejado de buscar.\n\nEso es lo que hace el Génesis con nosotros. No nos inventa un cuento: nos recuerda que hubo una casa. Y que la nostalgia que sentimos no es una enfermedad, sino la memoria de un hogar."}, {"t": "Capítulo 2 · La grieta", "x": "El corazón es más engañoso que todas las cosas, y perverso; ¿quién lo conocerá?\n\n— Jeremías 17:9\n\n—Entonces, ¿qué pasó? —preguntarás.\n\nLo que pasó lo sabe todo el mundo, y esa es la rareza. No hay ateo, por convencido que sea, que no haya oído hablar de Adán y Eva, aunque sea en una clase de filosofía. Y lo que se sabe de oídas se desprecia con facilidad. Por eso conviene preguntar lo que yo preguntaría a cualquier escéptico, con cariño pero sin rodeos: ¿cuánto de ese cuento has leído para decir que es un cuento? Y si lo has leído, ¿por qué te molesta tanto que otros lo crean? Nadie se enfurece con los dragones de papel. Uno se enfurece con lo que sospecha que puede ser verdad.\n\nLa serpiente no empezó negando. Empezó preguntando: «¿Conque Dios os ha dicho…?».\n\nDespués vino la insinuación de que Dios retenía algo bueno. Y por último, la promesa: «seréis como dioses». Todo el pecado cabe en esa frase. Fíjate bien: no fue un acto de desenfreno, sino de ascenso. El hombre no quiso hundirse; quiso subir. Quiso ser su propio centro, y en el acto perdió el eje. Y lo primero que hizo fue esconderse. Lo primero que hizo Dios, en cambio, fue preguntar: «¿Dónde estás?». No fue Dios quien se alejó. Fue el hombre quien se escondió, y Dios salió a buscarlo.\n\nHay en esto una paradoja que fascina a quien la mira de cerca. El hombre es grande y es miserable a la vez. Un animal no se avergüenza de su condición, pero el hombre sí; y esa vergüenza es la prueba de que recuerda haber sido algo más. Es un rey destronado que todavía camina con porte de rey. Por eso es incomprensible para quien lo mira como simple materia, y por eso es tan fácil, para quien lo mira como simple miseria, acabar despreciándolo. El Evangelio sostiene las dos cosas a la vez, y solo así lo explica. Si te preguntan dónde está la grieta, no señales hacia afuera. La Escritura dice que el corazón es más engañoso que todas las cosas, y que la raíz de toda clase de males es el amor al dinero. Ambas cosas dicen lo mismo con distinta cara: el problema nunca estuvo en la materia, sino en el corazón que la maneja. Un escritor ruso, que pasó años en un campo de trabajo, lo dijo con una claridad inolvidable: la línea que separa el bien del mal no corre entre los buenos y los malos, sino que atraviesa el corazón de cada ser humano. Quien lee eso en una celda ya no se atreve a señalar con el dedo.\n\nPor eso fracasaron las revoluciones que quisieron arreglar al hombre desde fuera. No porque sus autores fueran peores que nosotros, sino porque eran iguales. El mismo escritor, en una conferencia famosa, resumió medio siglo de desastres en una sola idea: los hombres olvidaron a Dios, y por eso pasó lo que pasó. No la tomes como consuelo, sino como diagnóstico.\n\nY no te quedes tampoco con la idea de que la grieta es un asunto de los otros, de los políticos, de los banqueros, de los que tienen poder. El dinero compra y el poder pervierte, es cierto; pero también el pobre codicia, y el pequeño se envanece, y el religioso se cree mejor. La grieta no distingue clases. Pasa por la mesa de los reyes y por la de los mendigos. Y quien la mire con honestidad la encontrará primero en su propia casa.\n\nHay una vieja imagen que me ayuda a entenderlo. Piensa en un reloj muy fino al que se le ha torcido un solo engranaje. No falla de golpe, ni del todo. Sigue marcando la hora, pero cada vez un poco más tarde, y cuanto más tiempo pasa más lejos queda de la verdad. El relojero no lo tira: lo abre, lo mira con cariño y lo repara. Pero para repararlo, primero hay que admitir que marca mal. Ese es el paso que más nos cuesta.\n\nAquí aparece siempre la objeción más antigua: ¿por qué puso Dios el árbol? ¿No habría sido más fácil no ponerlo? La pregunta es razonable, y merece una respuesta honrada. Para que haya amor tiene que haber posibilidad de rechazo. Un reloj de cuerda marca\n\nsiempre la misma hora, y nadie diría que ama a quien lo fabricó. Una caja de música toca la melodía que se le puso, y a nadie se le ocurre agradecerle. Pero un hijo que se queda en casa pudiendo irse, que obedece pudiendo desobedecer, que dice «te quiero» pudiendo callar, es otra cosa. El árbol no fue una trampa; fue el precio de una libertad verdadera. Dios prefirió correr el riesgo de un amor real a asegurarse un mecanismo perfecto.\n\nImagina a un padre que construye un robot idéntico a su hijo, que dice siempre lo que el padre quiere oír y hace siempre lo que el padre quiere ver. ¿Quién querría un hijo así? El padre sabría que detrás de esas palabras no hay nadie. La libertad, con todo su riesgo, es lo que hace que el «sí» valga algo.\n\nHay otro detalle que casi nadie recuerda. Antes de la caída, Dios advirtió. No dijo «haz esto o te aplasto»; dijo, con la claridad de quien conoce lo que viene, «el día que de él comieres, ciertamente morirás». Fue una advertencia de padre, no una amenaza de tirano. Quien advierte es porque ama. Y lo que siguió no fue el fin del amor, sino su costo: una cruz, mucho después, en una colina de Jerusalén. Ahí se ve cuánto estaba dispuesto a pagar por el riesgo que había corrido."}, {"t": "Capítulo 3 · La casa llena de ratas", "x": "Os daré corazón nuevo, y pondré espíritu nuevo dentro de vosotros; quitaré de vuestra carne el corazón de piedra.\n\n— Ezequiel 36:26\n\nImagina una casa llena de ratas y de basura. Es fácil echar a las ratas: basta con ruido, trampas, un buen gato. Pero si no se saca la basura, las ratas vuelven, o vienen otras, a veces más grandes. Así es el corazón del hombre que intenta reformarse sin que nada lo transforme. Lo limpia por la mañana y por la noche ya está otra vez sucio, y se desespera pensando que él es el problema, cuando el problema es que nunca hubo un habitante nuevo en la casa.\n\nJesús contó algo muy parecido. Un espíritu inmundo sale de un hombre, vaga por lugares áridos sin hallar reposo y resuelve volver. Encuentra la casa desocupada, barrida y adornada. Y entonces trae consigo otros siete peores que él. La casa no estaba habitada: solo estaba limpia. Y una casa limpia y vacía es la mejor invitación al desastre. El cristianismo, por eso, no se limita a decir «deja esto» o «deja aquello». Dice: recibe a Alguien que habite.\n\nDe ahí que la promesa no sea un corazón reformado, sino un corazón nuevo. Dice Dios por boca de Ezequiel que quitará el corazón de piedra y dará un corazón de carne. Dice Pablo que el amor de Dios ha sido derramado en nuestros corazones por el Espíritu Santo. No se trata de pulir lo que había, sino de ser llenados de lo que no había. Esa es la koinonía de la que habla el Nuevo Testamento: una comunión, una participación en la vida de Otro, y no un código de buena conducta. El moralismo dice: sé mejor. El Evangelio dice: eres amado, y por eso podrás ser otro.\n\nUna precisión que importa. La palabra kenosis, vaciamiento, aparece en Filipenses 2 para hablar de Cristo, que se despojó a sí mismo. No es primero nuestro vaciamiento, sino el suyo. Nosotros lo seguimos, como Juan el Bautista, que dijo que era necesario que Él creciera y que él menguara. Mengua el yo, y crece la casa llena de Otro. Pero quien se vacía de sí sin que Cristo lo llene solo ha cambiado una soledad por otra.\n\n—¿Y por qué entonces los cristianos hacen tanto mal? —preguntarás, y tienes derecho. Porque el corazón nuevo es una obra comenzada, no terminada. La vieja fórmula de los reformadores lo dice con una exactitud que sigue asombrándome: justo y pecador a la vez. No es una excusa para pecar, sino una confesión de por qué seguimos necesitando la gracia hoy, y mañana, y hasta el último día. Quien choca de verdad con Cristo no sale igual. Puede salir cojeando, como Jacob de aquella noche junto al río. Pero no sale igual.\n\nPermíteme una alegoría más, porque la casa de las ratas no agota el asunto. Había un hombre que llevaba puesto un abrigo de espinas. Lo había heredado, o lo había tejido él mismo, ya no lo recordaba; solo sabía que cada vez que alguien se le acercaba, las espinas hería al visitante. Entonces se lamentaba: «Nadie me quiere, todos me lastiman». No notaba que las heridas eran de su propio abrigo. Probó mil métodos para quitárselo. Se lo frotó, se lo cortó a pedazos, se lo escondió bajo otra ropa. Las espinas volvían a crecer. Un día llegó un Hombre que no le tuvo miedo. Le abrió los brazos, y las espinas lo traspasaron, y de sus manos corrió sangre. El hombre del abrigo, horrorizado, quiso apartarse, pero el Otro no se movió. Y mientras la sangre bajaba, las espinas empezaron a caerse una por una, hasta quedar el hombre desnudo, temblando, pero libre.\n\nNo es un cuento de moral. Es la historia del Evangelio con otras ropas. Lo que no pudimos quitarnos con ningún esfuerzo, lo quitó Aquel que dejó que lo hirieran. Y de ahí en adelante vivimos como quienes han salido de una ropa que ya no les pertenece, aunque a veces, por costumbre, sentimos todavía el roce de las puntas."}, {"t": "Capítulo 4 · Babel", "x": "Vamos, edifiquémonos una ciudad y una torre, y hagámonos un nombre.\n\n— Génesis 11:4\n\nSi la grieta pasa por el corazón, todo sistema que pretenda arreglar al hombre desde afuera será una torre de Babel con otro nombre. El relato de Babel es el más político de toda la Escritura: unos hombres se organizan para hacerse un nombre, para llegar al cielo por su cuenta, sin Dios. Y Dios baja a ver la torre, porque era tan pequeña que hizo falta bajar.\n\nHan fallado todas. El nacionalsocialismo fracasó. El comunismo fracasó. Cada uno inventó una antropología, un hombre nuevo, un futuro luminoso, y cada uno dejó a su paso fosas, campos y silencios. Pero no te fíes de quien crea que las democracias liberales o el mercado son la salida definitiva: también ellas pueden ser Babel, si prometen saciar lo que solo Dios sacia. Cada generación cree que ahora sí, que esta vez la política, la ciencia o la técnica traerán lo que no trajeron las anteriores. Y cada generación descubre, con el tiempo, que ahí están otra vez el corazón del hombre y sus ratas.\n\n¿Cuándo se divorció la humanidad de Dios? La Escritura cuenta tres rupturas, cada una más ancha que la anterior. La primera es el Edén: el hombre se esconde, y Dios pregunta dónde está. La segunda es Caín: roto el vínculo con Dios, se rompe el vínculo con el hermano, y la primera sangre humana cae sobre la tierra. Y la tercera es Babel: se rompe la humanidad como proyecto común. Del Edén a Caín, de Caín a Babel: de lo íntimo a lo social, de lo social a lo político. La grieta se agranda al pasar de la casa a la calle y de la calle a la plaza.\n\nY sin embargo, justo después de Babel, Dios llama a un hombre, Abraham, y le dice que en él serán benditas todas las familias de la tierra. La respuesta de Dios a la torre no es otra torre, sino una promesa. Y una familia. Y, al fin, un Niño en un establo. Las civilizaciones suben con ladrillos; Dios baja con un recién nacido.\n\nDijo Jesús que a los pobres los tendríamos siempre con nosotros. Cuida el filo de esa frase. Jesús la toma de Deuteronomio, y allí la frase continúa: por eso te mando que abras tu mano a tu hermano, al pobre y al menesteroso de tu tierra. No es una excusa para la indiferencia, sino una advertencia contra la utopía: ningún sistema borrará la pobreza, y por eso nadie queda dispensado de dar. El que espera que la política lo arregle todo se cruza de brazos. El que sabe que no lo arreglará abre la mano.\n\nDéjame contarte una alegoría sobre esto. Había una ciudad, la más grande de su tiempo, que decidió cubrir todas sus plazas con espejos. Los arquitectos decían que así cada ciudadano se vería a sí mismo y se admiraría, y que de tanta admiración brotaría la concordia. Al principio funcionó: todos andaban erguidos, sonrientes, seguros de sí. Pero con los años empezaron a notar algo raro. Nadie podía mirar más allá de su propio rostro. Los niños nacían y solo veían reflejos; los ancianos morían mirándose. Y llegó un día en que un forastero, que venía del campo, preguntó dónde estaba el cielo, y nadie supo contestarle. Habían llenado la ciudad de espejos y se les había olvidado que existían las ventanas.\n\nBabel siempre es eso: una ciudad que se contempla a sí misma. Y lo que Dios hace, siempre, es abrir una ventana.\n\nHay que decir también cómo termina la historia de Babel, porque su desenlace anuncia otra escena. Dios confundió las lenguas, y los hombres, que se habían propuesto ser uno para hacerse un nombre, quedaron dispersos, sin entenderse. Siglos después, en Jerusalén, en un aposento alto, los discípulos esperaban, y vino un viento y unas lenguas como de fuego, y los que estaban allí, que venían de todas partes del mundo, oyeron hablar cada uno en su propio idioma de las maravillas de Dios. Babel dividió con las lenguas; Pentecostés, con las lenguas, reunió. Lo que la soberbia rompió, el Espíritu lo sana. No volvemos a una lengua única, que sería una nueva torre, sino a una comprensión mutua en la diversidad.\n\nEse es el modelo de Dios: no la uniformidad de las ciudades de ladrillo, donde todos hablan, visten y piensan igual, sino la armonía de una orquesta donde cada instrumento suena distinto y todos tocan la misma pieza. Quien quiera arreglar al hombre con una sola receta repetirá a Babel; quien le abra la puerta al Espíritu verá la orquesta.\n\nY mientras tanto, nosotros, que no somos arquitectos de ciudades sino habitantes de ellas, tenemos una tarea modesta y enorme: ser ventanas. No espejos que devuelven la imagen de quien pasa, ni muros que la bloquean, sino cristales limpios por donde pueda entrar la luz. Un cristiano que de verdad lo es no llama la atención sobre sí mismo. Se deja atravesar."}, {"t": "Capítulo 5 · El duelo que se transita", "x": "Jehová está cercano a los quebrantados de corazón, y salva a los contritos de espíritu.\n\n— Salmo 34:18\n\nHay cosas que no se pueden contar. Hay que transitarlas.\n\nYo viví una pérdida. Estuve con mi pareja hasta el último aliento y le sostuve la mano. Tenía treinta y siete años, me llevaba dos de ventaja, y ya hace tres que se fue. Conozco el peso del cuerpo que duerme a tu lado, la forma de una mano que se queda en la tuya, el objeto que sigues tocando como si guardara todavía algo de su calor. Y aun así tuve que sostener mi integridad de ministro y predicar en su propio funeral. Nadie me enseñó a hacerlo. Se aprende en el mismo instante en que no queda otra cosa.\n\nNo era perfecta. Lo digo porque es verdad, y porque casi todo elogio fúnebre convierte al muerto en santo, mientras que el Evangelio hace lo contrario: dice que no hay quien sea bueno, y que Dios va perfeccionando a los suyos. Amar de verdad es amar a la persona real, con sus faltas, y no a la estatua que construimos después. Ella también preguntó, como pregunta cualquiera, si tanta vida había sido en vano. Pero creyó hasta el umbral, lo cruzó creyendo, y a mí me tocó estar ahí, con su mano en la mía, para decirle que siguiera. No voy a ser yo quien deje de creer.\n\n—¿No será que crees por conveniencia? —me han preguntado.\n\nLa conveniencia no sube al púlpito en el funeral de la propia pareja. Hay creencias que consuelan y hay creencias que sostienen, y solo las segundas se pueden predicar con la voz quebrada. Un cuento no sostiene a nadie: sirve para pararse encima, y se quema ante el primer fuego real. Yo agradezco en lo bueno y en lo malo, no porque el dolor sea pequeño, sino porque el Dios que prometió la resurrección es más grande que él.\n\nAhora bien: no quiero que este libro se convierta en un libro sobre mi pérdida. Su camino terminó y su estación quedó atrás; el mío sigue, y hay mucho terreno por delante. Por eso esta historia aparece aquí, en su lugar, y no más allá. No es el núcleo. El núcleo es la luz de cada día hasta que se apague, y mientras haya luz hay que caminar a su amparo, con las cosas que uno tiene que contar.\n\nPero sí quiero decirte lo que el desierto enseña, porque no se aprende de otro modo. El duelo existe y es real. Pablo no prohíbe llorar: prohíbe llorar como los que no tienen esperanza. Se transita, y se puede elegir lo contrario, que es mudarse a vivir en él. Hay\n\nquienes nunca se sobreponen ni trascienden. Yo no los juzgo; sé lo cerca que se pasa de ahí. Y sé también que no se habla de la rosa sin espinas. Hablo de una rosa con espinas, en la mano de Quien me la dio.\n\nLo que me sostuvo no fue una idea. Fue una Persona. Y para quien aceptó ese cheque en blanco, que es la fe, no existen los adioses. Existen los hasta luego.\n\nQuiero dejarte, para el que viene por este camino, algunas cosas que aprendí sobre el duelo. No son consejos de manual, sino señales de un camino que anduve a tientas.\n\nLa primera: no tengas prisa. Se oyen frases como «ya pasó un año, tienes que seguir adelante», pronunciadas por gente que quiere bien y que no sabe lo que dice. El duelo no tiene calendario. Hay días en que uno creerá que ya salió del pozo y otro día, en un supermercado, ante un frasco de mermelada que ella compraba, se hundirá de nuevo. No es retroceso. Es el camino. Las olas vuelven, y cada vez rompen un poco más lejos.\n\nLa segunda: nombra al que se fue. Hay quien deja de pronunciar el nombre del muerto por miedo a lastimar a los demás, y el silencio se vuelve una segunda pérdida. Habla de ellos, cuenta lo que hacían, ríete de lo que decían. Los muertos mueren dos veces cuando se los deja de nombrar.\n\nLa tercera: deja que Dios llore contigo. Jesús lloró ante la tumba de Lázaro, aun sabiendo que estaba a punto de resucitarlo. Lloró. Eso me consuela más que cualquier teoría. Un Dios que llora ante la muerte no es un Dios que se aleja de ella: es un Dios que entra. Piensa en una vela. Cuando se apaga la de la casa, uno se queda a oscuras y se siente huérfano. Pero se puede encender otra con la llama de la que sigue ardiendo en otra habitación. No es la misma vela, y nadie dice que lo sea. Es el mismo fuego, pasado de mano en mano. Así se honra a los que se fueron: no manteniendo intacta una habitación vacía, sino pasando su llama. Yo sigo contando lo que ella me enseñó, y eso es, a mi modo, mantenerla encendida.\n\nY la cuarta, que es la más difícil: acepta que algunas preguntas no tendrán respuesta aquí. Yo todavía pregunto, y lo hago sin culpa. Preguntar no es no creer. Los salmos están llenos de preguntas lanzadas hacia lo alto, con los puños cerrados, y Dios las dejó en la Biblia para que supiéramos que le caben."}, {"t": "Capítulo 6 · Cómo trasciende el hombre", "x": "Si subo a los cielos, allí estás tú; y si en el Seol hago mi estrado, allí también.\n\n— Salmo 139:8\n\nSe suele pensar que trascender es subir. Subir de nivel, subir de clase, subir en el conocimiento, subir hasta tocar algo que está arriba. El hombre moderno lo intenta con una escalera de datos, y el antiguo con una torre de ladrillos. Pero la Escritura cuenta otra cosa: el hombre quiere subir al cielo, y el cielo baja a un establo.\n\nAhí está la diferencia entre todas las religiones de escalera y el Evangelio. En las primeras, el hombre se esfuerza y espera que alguien lo reciba. En el segundo, Dios mismo se hace hombre, atraviesa el abismo que el hombre no podía cruzar y se queda de este lado.\n\nTrascender no es escalar: es ser alcanzado. Es lo que Agustín descubrió después de buscar a Dios por todas partes: Él estaba dentro de mí, y yo afuera, lanzándome sobre las cosas hermosas de la tierra. Dios es más íntimo que lo más íntimo de uno mismo, y más alto que lo más alto.\n\nPor eso enloquecen los matemáticos y los jugadores de ajedrez, y no los poetas. El loco no es el que ha perdido la razón, sino el que lo ha perdido todo menos la razón. Quiere meter el mar entero en su pequeña cabeza, y no le cabe ni un vaso. El poeta, en cambio, se alegra de que el cielo lo contenga a él. Hay una sabiduría en dejarse contener. Si subo hasta lo más alto, allí estás Tú; si bajo hasta lo más profundo, allí también, dice el salmista. No hay lugar donde ir para esconderse, y tampoco lo hay para perderse.\n\nPascal vio con claridad que el hombre supera infinitamente al hombre. Hay en nosotros un anhelo que nada de este mundo sacia. Un pez con sed no prueba nada hasta que descubre que existe el agua; pero un pez con sed ya es una pista. Ese anhelo es el indicio, no la prueba, de que fuimos hechos para otra parte. Y por eso quien trasciende lo hace de un modo que el mundo no entiende: muriendo. Cuando Cristo llama a un hombre, le dice que venga y muera. Y de diez personas que leen esto, diez van a morir, tú incluido. La pregunta nunca fue si cruzaremos el umbral, sino con quién.\n\nKierkegaard, ese danés que escribió tanto sobre la fe, contó una vez una historia que me gusta retomar con mis palabras. Había un rey poderoso que se enamoró de una aldeana humilde. Quería casarse con ella, pero se preguntaba cómo hacerlo. Si la llamaba a palacio con todo su fasto, ella aceptaría por miedo o por ambición, y no por amor. Si enviaba un ejército a buscarla, sería una conquista, no un amor. Y se dio cuenta de que la única manera de que ella lo amara de verdad era que no supiera quién era él. Entonces se quitó la corona, se vistió de campesino, y se fue a vivir a la aldea. Trabajó con sus manos, compartió su pan, la acompañó en sus tardes. Y al ganarse su corazón, lo que ganó fue un amor sin cálculo.\n\nAsí lo hizo Dios. No mandó un ejército de ángeles para convencernos. Se quitó la gloria, se hizo hombre, trabajó con las manos, tuvo sed, tuvo hambre, tuvo amigos. Eso es la encarnación: el Rey que se hace aldeano para ganar un amor verdadero. Y por eso podemos decir, sin temor a exagerar, que el cristianismo no es una religión de escalera, sino de descenso.\n\nHay un efecto de esto que me asombra cada vez que lo pienso. Si Dios se hizo carne, la carne no es un estorbo para lo espiritual. Los cuerpos, el pan, el vino, el agua, la tierra, el abrazo, todo lo material queda tocado por lo divino. El cristiano no desprecia lo corporal: lo bendice. Y por eso una comida compartida puede ser un acto sagrado, y un entierro, una siembra."}, {"t": "Capítulo 7 · La libertad y las jaulas", "x": "Vino la luz al mundo, y los hombres amaron más las tinieblas que la luz, porque sus obras eran malas.\n\n— Juan 3:19\n\n—Si trascender es ser alcanzado —dirás—, ¿qué lugar le queda a la libertad del hombre? Le queda el más importante. Porque solo hay una decisión que de verdad importa, y es la que Juan dice con su sencillez de pescador: la luz vino al mundo, y los hombres amaron más las tinieblas que la luz, porque sus obras eran malas. Esa es la condenación: preferir la oscuridad. Y la contrapartida aparece unas líneas después: el que practica la verdad viene a la luz, para que se vea que sus obras son hechas en Dios.\n\nFíjate en esa última cláusula. Lo bueno que haces no viene de ti. No estamos hablando de moral: un ateo puede hacer buenas obras, y las hace. Estamos hablando de origen. Por eso somos salvados por gracia, y no por mérito. Venir a la luz con el corazón roto, con las miserias a cuestas, es la única decisión posible para quien sabe que no tiene nada que ofrecer. Y aun esa decisión, desde mi lectura reformada, es don. La libertad y la gracia no compiten: la gracia es lo que hace libre a la libertad.\n\nMira al ladrón en la cruz. No llegó limpio. No llegó de traje, como quien espera morir bien vestido para entrar al cielo. Llegó desnudo, escupido, sangrando, entre polvo y tierra, que es lo que siempre fue. Y la puerta se abrió igual: hoy estarás conmigo en el paraíso. No hubo tiempo de enmendarse, de bautizarse en un río, de aprenderse un credo. Hubo una sola elección, y bastó.\n\nPorque libertad no es hacer lo que quiero. Libertad es hacer aquello para lo que nací. El pájaro en la jaula aletea, hace cuanto puede, pero nació para volar en las alturas. Entre hacer lo que uno quiere y hacer aquello para lo que uno nació hay una diferencia enorme. Y hay cárceles más grandes que una jaula.\n\nLa primera es la del intelecto. Es la del hombre que cree que depender de Dios es ignorancia, que la fe es debilidad de mentes que no han leído lo suficiente. Es una jaula elegante, con barrotes de libros, y por eso es tan difícil que el prisionero se dé cuenta de que está dentro. Ha leído mucho de lo que se dice contra Dios y poco de lo que dijo Él. Pero lo cierto es que muchas de las mentes más grandes que ha dado la humanidad creyeron en Dios y vivieron y murieron por esa fe. No lo digo como argumento de autoridad, sino como cura de arrogancia.\n\nLa segunda es la del ego, que susurra que uno se basta a sí mismo. Es la jaula del que no pide ayuda, no pide perdón y no pide nada. Pequeña, cómoda, hecha a la medida de una sola persona.\n\nLa tercera es la del miedo: miedo al qué dirán, miedo al fracaso, miedo a la muerte, miedo a la vida, miedo a los vivos y miedo a los muertos. Cristo dijo que no temiéramos a quienes matan el cuerpo y después no pueden hacer más, sino a quien puede hacer caer en el fuego. Y dijo también, en otro lugar, que el perfecto amor echa fuera el temor. Tantos tipos de miedo, y un único antídoto.\n\nEs la misma jaula con distintos disfraces. Es la pelea que el hombre tiene consigo mismo, y es la única que debe perder. La mayoría de las veces no la pierde. Por eso el hombre moderno, que derribó las jaulas de piedra con ciencia, medicina, comunicaciones y progreso, se siente más encerrado que nunca. Nunca hubo tantos puentes y tan pocos encuentros. Tiene mil voces en el bolsillo y nadie que lo mire a los ojos. Está conectado y solo. Isaías y Jesús hablaron ya de ojos que no ven; lo nuevo es que ahora la ceguera tiene pantalla.\n\nY aquí está la paradoja que ningún sistema entiende: Pablo, el hombre más libre del Nuevo Testamento, se presenta a sí mismo como esclavo de Cristo. El mundo cree que solo hay dos opciones, ser amo o ser esclavo. Pero nadie queda sin amo. Se elige a quién servir: al yo, que es un tirano que jamás se sacia, o a Aquel cuyo yugo es suave. Su Amo no le exige ser más de lo que es, sino ser quien nació para ser.\n\nHay una alegoría que quiero dejar aquí, porque me parece que desenmascara la ilusión de muchos. Un prisionero llevaba años en una celda oscura. Cada mañana, un carcelero le traía pan y agua y no decía nada. El prisionero soñaba con la libertad, pero se resignaba: la puerta estaba cerrada, la llave la tenía otro. Un día, por casualidad, el carcelero olvidó la puerta entornada. El prisionero, con el corazón en la garganta, se acercó a la rendija, vio la luz del pasillo y, de pronto, sintió pánico. Afuera había ruido, decisiones, riesgos. En la celda, por lo menos, todo era conocido. Se quedó sentado. La puerta se cerró de nuevo. Y el prisionero, desde entonces, no dejó de lamentarse de su cárcel, sin recordar que alguna vez la había tenido abierta.\n\nMuchos no están presos por falta de llave, sino por miedo a la libertad. Prefieren la queja conocida a la aventura de salir. Y Cristo, que dijo que si el Hijo os libertare seréis verdaderamente libres, no viene a ofrecernos una celda más cómoda, sino una puerta abierta y una mano para el pasillo. Es posible que afuera haya ruido. Es seguro que hay luz. Que esa sea tu decisión hoy. No una gran decisión, no un voto solemne ante nadie, sino algo tan simple como levantarte del suelo de la celda y caminar hacia la rendija. El resto, créeme, lo hace Él."}, {"t": "Capítulo 8 · La casa en obras", "x": "Estando persuadido de esto: que el que comenzó en vosotros la buena obra, la perfeccionará hasta el día de Jesucristo.\n\n— Filipenses 1:6\n\nHay una imagen que me persigue desde que la leí, y que me gusta contar con mis palabras. Imagina que eres una casa, y que un día llega un constructor. Tú pensabas que venía a arreglar una gotera, a pintar una pared, a cambiar un picaporte. Y es verdad: empieza por lo pequeño. Pero pronto empieza a tirar abajo paredes que tú creías buenas, a abrir ventanas donde no las pedías, a levantar un piso nuevo y una torre. Te quejas: yo solo quería una casita decente. Y Él responde, con una paciencia infinita: estoy construyendo un palacio, y voy a vivir en él.\n\nAsí es la obra de Dios en el hombre. No viene a mejorarte un poco. Viene a hacerte lo que fuiste hecho para ser. Y eso duele, porque nadie se deja desmontar sin quejarse. Pero un hombre que acepta ser obra y no solo ocupante descubre, con el tiempo, que el polvo y los andamios no eran castigo: eran el precio de lo que se estaba levantando.\n\nPor eso el cristiano no se escandaliza de estar a medio hacer. Se escandaliza el que cree que la fe es un resultado y no un proceso. Pablo, ya viejo, se confiesa en camino: no que ya lo haya alcanzado, dice, sino que prosigue. Si ese hombre, que fundó iglesias y escribió media Biblia, se sabía en obras, ¿con qué derecho te vas a exigir estar terminado?\n\nY hay un consuelo escondido ahí: la obra no depende de ti, sino de Quien la empezó. Los andamios se ven feos y no hay que mostrarlos con vergüenza. Hay que dejarle al Arquitecto el plano. A ti te toca algo más modesto y más difícil: no echarlo de la obra. Quienes vienen de la tradición reformada hablan de la santificación, y los pentecostales de la llenura del Espíritu. Es posible que usemos palabras distintas para referirnos a lo mismo: que Dios no se limita a perdonarnos, sino que nos transforma desde adentro, poco\n\na poco, a lo largo de toda una vida. El perdón es un acto; la transformación, un proceso. Quien quiera lo primero sin lo segundo ha entendido a medias el Evangelio, y quien pretenda lo segundo sin lo primero está intentando construir sin cimientos.\n\nEn la casa en obras hay tres clases de golpes, y conviene reconocerlos. Hay golpes que son de demolición: Dios derriba lo que no podía sostenerse, un orgullo, un vicio, una relación que nos envenenaba. Duelen, y casi siempre los interpretamos como castigo, cuando son rescate. Hay golpes de restauración: Dios repara lo que se rompió, una memoria que nos atormentaba, una amistad herida, una fe que se había enfriado. Y hay golpes de edificación: Dios levanta lo nuevo, un don, una vocación, una capacidad de amar que no teníamos. No siempre sabemos cuál de los tres está sonando en nuestra casa. Lo que sí sabemos es que el que golpea no está enojado.\n\nPor eso el cristiano maduro no se asombra del polvo. Se asombra, más bien, de la paciencia del Constructor. Cuántas veces hemos abandonado la obra a medias, cuántas veces le hemos dicho que ya basta, cuántas veces hemos cerrado una puerta que Él había abierto. Y Él vuelve, con los mismos planos, con la misma ternura, y dice: «Sigamos»."}, {"t": "Capítulo 9 · El umbral", "x": "Enséñanos de tal modo a contar nuestros días, que traigamos al corazón sabiduría.\n\n— Salmo 90:12\n\nEn medio de la vida estamos en la muerte. Es una frase antigua, y es exacta. Desde que nacemos empezamos a morir, y el que lo ignora no por eso vive más: solo vive peor.\n\nNuestra cultura ha hecho de la muerte una vergüenza. La esconde en los hospitales, la maquilla en las funerarias, la pone entre paréntesis en las conversaciones. Y mientras más la esconde, más miedo da, porque lo que no se mira crece en lo oscuro.\n\nLa Escritura hace lo contrario. Dice que es mejor ir a la casa del luto que a la casa del banquete, porque allí se ve el fin de todos los hombres y el que vive lo toma a pecho. No lo dice por amargura, sino por sabiduría. Quien nunca ha mirado el umbral no sabe qué hacer con su tiempo: lo gasta como si le sobrara. En cambio, quien lo ha mirado aprende a contar los días, no para angustiarse, sino para que el corazón se vuelva sabio.\n\nHay dos modos de pasar por la vida frente a esa puerta. El primero es el de quien la ignora y la tapa con ruido, con trabajo, con pantallas, con diversión, con la prisa de quien llega tarde a ninguna parte. El segundo es el de quien la mira de frente y se pregunta qué hará con los días que le quedan. El primero tiene miedo siempre, aunque no lo sepa. El segundo puede tenerlo a veces, pero conoce la causa y sabe a quién acudir.\n\nQuizá me creas si te digo que yo estoy listo para pasar el umbral. Lo digo sin dramatismo y sin prisa, porque no es lo mismo estar listo que querer irse. Estar listo es haber puesto la vida en manos de Otro. Querer irse, en cambio, es otra cosa, y de eso hablaré más adelante, con cuidado. Pero hay mucha gente que no está lista ni siquiera para mirarlo desde lejos. Y es comprensible: nadie nos enseñó. Nos enseñaron a ganar, a producir, a gustar. Nadie nos enseñó a morir.\n\nDice la Escritura que está establecido a los hombres que mueran una sola vez, y después de esto el juicio. Dice también que Cristo venció a la muerte, y que quien cree en Él, aunque muera, vivirá. Dos afirmaciones que ningún sistema logra juntar, y que el Evangelio sostiene sin esfuerzo, porque la segunda responde a la primera. No tenemos que cruzar solos: Alguien cruzó antes y volvió.\n\nCuenta una vieja alegoría de una estación de tren grande, con andenes, relojes y bancos de madera. Todos los viajeros esperan, y todos saben que su tren llegará, pero nadie sabe a qué hora. Hay quienes se pasan la espera mirando el reloj con angustia. Hay quienes la llenan de ruido para no oírlo. Y hay una anciana, sentada en un banco con una maleta pequeña, que teje tranquila. Alguien le pregunta cómo puede estar tan serena. Ella sonríe: «Porque ya compré el billete, y quien me lo vendió prometió venir a buscarme». Esa mujer no es ingenua; ha visto partir muchos trenes. Pero sabe en manos de quién está su viaje. No se trata de esperar la muerte con prisa ni con terror. Se trata de tener el billete en el bolsillo y la lana en las manos, y de hacer mientras tanto lo que hay que hacer.\n\nLos antiguos cristianos tenían un arte que hemos perdido: el arte de bien morir. No lo vivían con morbo, sino con serenidad. Preparaban su casa, perdonaban a sus enemigos, pedían perdón a sus hijos, repartían lo poco que tenían y se encomendaban. Hoy, en cambio, la muerte llega muchas veces sin aviso, y nadie dijo lo que había que decir. Hay quien muere sin haberle dicho «te quiero» a su padre, y hay quien entierra a su madre con una cuenta pendiente. Una de las cosas más prácticas que puedes hacer hoy, sin esperar a ningún diagnóstico, es decir lo que hay que decir mientras todavía se puede.\n\nTambién es bueno hablar de la muerte con los niños, sin dramatismo, con palabras sencillas. Una abuela que se va no es un tabú; es una despedida. Los niños que ven a los mayores llorar, rezar y recordar, aprenden que la muerte duele pero no destruye. Los que crecen en un silencio absoluto sobre ella la imaginan peor de lo que es.\n\nHay una escena que no me canso de leer. Jesús llega a Betania, cuatro días después de la muerte de Lázaro. Marta le sale al encuentro y le reclama, con razón: si hubieras estado aquí, mi hermano no habría muerto. Él no le da un sermón. Le dice: «Yo soy la resurrección y la vida». Y le pregunta: «¿Crees esto?». Esa pregunta es la que cada uno tendrá que responder, algún día, ante su propia Betania. No es una pregunta de teología. Es una pregunta de confianza.\n\nQuien puede decir «sí, creo» junto a una tumba abierta, no ha apagado el dolor, pero ha encendido algo más fuerte. Y esa es la lámpara de la que habla este libro."}, {"t": "Capítulo 10 · Los niños", "x": "Dejad a los niños venir a mí, y no se lo impidáis; porque de los tales es el reino de los cielos.\n\n— Mateo 19:14\n\nLos discípulos pensaban que los niños estorbaban. Estaban ocupados con asuntos mayores: el reino, la política, la doctrina. Y Jesús, indignado, los regañó y puso a un niño en medio. Todo el cristianismo cabe en ese gesto: los pequeños no son un paso previo a la vida de verdad. Son la vida de verdad, vista sin los disfraces.\n\nUn niño sabe pedir. No se avergüenza de necesitar, no calcula, no se compara. Pide con los dos brazos levantados, y esa es la postura que Dios espera de nosotros. Los adultos hemos desaprendido el arte de recibir; creemos que todo se gana, y por eso nos cuesta tanto la gracia. El niño no entiende de mérito: sabe que lo cuidan. Y quien acepta ser cuidado tiene mucho andado en el camino hacia Dios.\n\nPero un niño es también un ser frágil, y sobre esto la Escritura es severa. A quien haga tropezar a uno de estos pequeños, dijo Jesús, más le valdría que le colgaran al cuello una piedra de molino. Pocas frases del Evangelio son tan duras, y no es casualidad. Un niño aprende quién es Dios mirando cómo lo tratan los adultos. Si el padre es duro, imaginará un Dios duro. Si la madre está ausente, creerá que Dios también se va. Nuestras casas son, para los más pequeños, la primera teología.\n\nPor eso nada de lo que hagamos por un niño es pequeño. Una tarde de atención, una palabra de ánimo, una oración dicha junto a su cama, un abrazo sin prisa: todo eso va quedando en el fondo, como sedimento, y de ahí se alimentará su fe mucho después de que olvide quién le dio cada cosa. Pablo escribe a los padres que no exasperen a sus hijos, para que no se desalienten. No dice que sean perfectos. Dice que no los apaguen.\n\nHay una imagen que me ayuda a entender la tarea de los padres, y es la del jardinero que planta semillas que no verá florecer. En algunas partes del mundo se plantan olivos, y el que los planta sabe que dará frutos a sus nietos. Hay que tener la paciencia del que siembra para otros. Educar a un niño en la fe es sembrar en un suelo que todavía no da flores. Durante años parece que nada brota. Y entonces, de repente, en la adolescencia o en la madurez, aparece un brote: una oración que el hijo recuerda, un versículo que le vuelve a la mente, una forma de tratar al prójimo que aprendió sin darse cuenta.\n\nNo hace falta ser un teólogo para criar un hijo en la fe. Hace falta algo más sencillo: que los hijos nos vean orar, que nos oigan pedir perdón, que sepan que en casa se da gracias antes de comer, que descubran que papá y mamá también se equivocan y vuelven a empezar.\n\nUn padre que dice «me equivoqué» enseña más de la gracia que mil sermones. Y una madre que reza en voz baja junto a la cama de su hijo dormido está plantando un olivo. Dos peligros, uno a cada lado del camino. El primero es el moralismo: criar niños que saben qué está prohibido pero ignoran que son amados. Un niño que solo conoce las reglas termina odiando al que las puso. El segundo es la indiferencia: dejar que el niño «elija solo cuando sea grande», como si la fe fuera un menú que se puede ver desde la neutralidad. Nadie es neutral; el niño aprende algo, sea lo que sea, de cada casa. Mejor que aprenda de una donde se le ame y se le hable de Dios con naturalidad.\n\nY una cosa más: no te asustes si tu hijo pasa por una etapa de dudas. Las dudas no son el enemigo de la fe; son su aduana. Un niño que nunca duda, quizá nunca pensó.\n\nAcompáñalo, escúchalo, respóndele con honestidad cuando sepas, y con honestidad cuando no sepas."}, {"t": "Capítulo 11 · La adolescencia descuidada", "x": "No exasperéis a vuestros hijos, para que no se desalienten.\n\n— Colosenses 3:21\n\nHay una edad que nadie sabe tratar, ni los que la viven ni los que la rodean. No es la niñez con piernas largas, ni la adultez en pequeño. Es un territorio intermedio, con sus propias leyes, donde el cuerpo cambia más rápido que el alma, el alma más rápido que el lenguaje, y el lenguaje más rápido que la paciencia de quienes cuidan. Y es la edad que más descuidamos.\n\nLa descuidamos de dos maneras opuestas. Unos la tratan como a un niño y le responden con órdenes, como si el chico siguiera entrando a una escuela primaria. Otros la tratan como a un adulto y lo dejan solo con decisiones que todavía no puede cargar. En ambos casos el adolescente recibe el mismo mensaje: no te veo. Y un chico que no se siente visto empieza a buscar quién lo vea.\n\nPermíteme contarte una parábola, con otros nombres y otro paisaje, porque hay historias que pesan más cuando no se les pone cara.\n\nHabía una vez una guardiana de faro. Era una mujer entregada, de las que no duermen para que otros lleguen a buen puerto. Su luz salvaba barcos de todos los rumbos, y desde la costa la bendecían. Tenía un hijo que crecía a la sombra del faro, y que un día, ya casi hombre, le dijo algo que ella oyó sin escuchar: que ya no quería navegar, que se sentía demasiado cansado para seguir a flote. Ella estaba encendiendo la lámpara, y respondió que hablarían después. El después nunca llegó con calma. El muchacho se fue a otro puerto, y allí unas manos extrañas le tendieron una cuerda y un plato caliente, y le dieron más abrazos que los que había tenido en años en su propia casa. Mucho después, la guardiana lo contó con una honestidad que no olvido: «Cuidaba la luz de todos y no vi la que se apagaba en mi casa».\n\nLa guardiana no era negligente. Era una mujer que daba todo lo que tenía. Y sin embargo no vio. Con frecuencia el amor más sincero es también el más ciego, porque confunde el esfuerzo con la presencia. Se puede amar mucho y estar ausente. Se puede estar en la misma mesa y en distinto planeta.\n\nQuiero decir tres cosas, con toda la humildad que me da no ser especialista.\n\nLa primera: cuando un joven dice que quiere morirse, hay que tomarlo en serio, siempre. No como chantaje, no como exageración, no como fase. Hay que escucharlo antes de responderle, sin sermones ni versículos disparados a quemarropa, y hay que hacerlo cuanto antes. Quien dice eso casi nunca quiere dejar de existir; casi siempre quiere que algo deje de doler y no sabe cómo pedirlo. Y hay que buscar ayuda profesional y acompañamiento sin demora: un médico, un psicólogo, el servicio de emergencias de tu país, las líneas de ayuda de tu zona, alguien de confianza que no lo deje solo. La fe no sustituye eso; lo acompaña. Nadie que se está ahogando rechaza la cuerda por tener fe, y Dios suele alargarla por manos humanas.\n\nLa segunda: el adolescente no necesita un amigo que le dé la razón ni un juez que lo condene. Necesita un adulto que se quede. Que lo mire, que no se asuste, que no huya cuando le cuenten algo feo. La mayor muestra de amor no es resolver, sino permanecer. La tercera: la Biblia tiene una escena para esto. El profeta Elías, después de la mayor victoria de su vida, huye al desierto, se sienta bajo un arbusto y le pide a Dios que lo deje morir. Fíjate en lo que Dios no hace. No lo regaña, no le da una conferencia, no le recuerda lo grande que fue. Le manda un ángel que lo toque y le diga: levántate, come. Lo hace\n\ndormir. Le da pan. Después de eso, y solo después, viene la voz suave y delicada en la que Dios se hace oír. A veces el primer acto de fe no es una predicación: es un plato de comida, un sueño reparador y una mano en el hombro.\n\nQuiero escribirle unas líneas, en este punto, al adolescente que quizá esté leyendo esto, o a quien lo tiene cerca.\n\nSi eres joven y estás leyendo, quiero decirte tres cosas. La primera: lo que sientes es real, aunque los adultos digan que «ya se te pasará». Lo que te pasa te pasa, y vale. La segunda: no estás tan solo como crees. Hay adultos que te quieren, aunque no sepan decírtelo, y hay otros, fuera de casa, que podrían ser puentes: un maestro, un pastor, un tío, un amigo mayor. Busca a uno. Dile algo verdadero, aunque sea chiquito. La tercera: Dios no se escandaliza de tus preguntas. Él las oyó todas ya, y sigue ahí.\n\nLos adolescentes tienen un radar admirable para la hipocresía. Detectan, a kilómetros, al que dice una cosa y vive otra. Y tienen razón: la hipocresía es lo que más aleja a la gente de la fe. Si vives lo que crees, aunque lo hagas con torpeza, un adolescente te mirará con respeto. Si lo predicas pero no lo vives, te descartará sin pestañear.\n\nHay en esta edad, además, una ansiedad de pertenecer que a veces se paga muy cara. Un chico dispuesto a cualquier cosa con tal de no quedarse fuera. Las pantallas han agravado todo: ahora cada gesto se mide en reacciones, cada foto en aprobaciones, cada silencio en abandonos. Nunca ha sido tan fácil sentirse visto sin ser mirado. Y ahí, justo ahí, la Iglesia tiene una oportunidad enorme: ser el lugar donde alguien te mira de verdad, no por lo que publicas, sino por quién eres. Un lugar donde no hay que competir. Donde alguien te sirve un plato y te pregunta cómo estás, y espera la respuesta.\n\nA los padres y a los pastores les diría: no tengan miedo del silencio del adolescente. A veces el silencio es el principio de una confianza, no su final. Esperen. Estén cerca. Pongan la mesa, y dejen la silla vacía para cuando llegue."}, {"t": "Capítulo 12 · La juventud y la madurez", "x": "Acuérdate de tu Creador en los días de tu juventud.\n\n— Eclesiastés 12:1\n\nHay un tiempo en que la vida parece una promesa sin límite. Las fuerzas sobran, los caminos están abiertos y la muerte es un asunto de otros. En esa edad se toman las decisiones que pesan más que ninguna: a quién amar, a qué dedicarse, en qué creer. Y se toman, casi siempre, con más entusiasmo que conocimiento.\n\nPablo le dijo a un joven que no dejara que nadie despreciara su juventud, sino que fuera ejemplo en palabra, conducta, amor, fe y pureza. No le pidió que fingiera ser viejo. Le pidió que se tomara en serio. El joven no necesita permiso para ser fiel; lo que necesita es no hacerse el tonto. Porque la juventud se disfraza de libertad y tiene, a menudo, mucho de prisa. Y de todas las prisas, la peor es la de quien quiere vivir sin haber aprendido a esperar.\n\nLa madurez llega, y llega con otro rostro. Hacia la mitad del camino, el hombre mira atrás y se da cuenta de que muchas de las cosas por las que se desvivió eran humo. El poeta de la Comedia lo confiesa sin pudor: en esa mitad de la vida se halló perdido en una selva oscura. Es el tiempo de las crisis, y las crisis de la mitad de la vida no son un fracaso sino una oportunidad. Allí uno se pregunta quién es, para qué sirvió todo, y qué quedará. Quien hace esa pregunta con honestidad suele terminar en la puerta correcta. Quien la tapa con otra compra, otra aventura o otro proyecto, vuelve a la selva con más equipaje.\n\nEntre la juventud que corre y la vejez que mira hay una verdad que la mediana edad conoce y pocos dicen: el trabajo es más que sustento, es vocación, y la vocación es más que ambición. Dios puso al hombre en el jardín para que lo labrara y lo guardara, antes de la caída. El trabajo no es castigo; lo que se volvió duro con el pecado fue el sudor. Quien trabaja para servir encuentra un descanso que no encuentra quien trabaja para llegar. Piensa en un río joven que baja de la montaña. Tiene fuerza de sobra y ninguna dirección. Salta, espuma, se desborda, arrastra lo que no debe. Los más viejos construyen diques, y
