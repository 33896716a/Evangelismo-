 el río los odia, porque cree que le quitan la libertad. Pero cuando por fin el agua pasa por una turbina, de pronto se vuelve luz en mil casas. El dique no mató al río: lo volvió útil. La juventud necesita cauce, no para apagar su fuerza, sino para que no se pierda en el primer pantano. Y los viejos, que construyen los diques, deben acordarse de que ellos también fueron río.\n\nEl libro del Eclesiastés, que parece escrito por un hombre que ya lo ha probado todo, empieza con una queja famosa: vanidad de vanidades, todo es vanidad. Pero termina con una invitación a los jóvenes que no puedo dejar de citar: acuérdate de tu Creador antes que vengan los días malos y lleguen los años de los que digas «no tengo en ellos contentamiento». Quien escribió eso no condena la alegría; la aconseja, con una condición: que no se agote en sí misma.\n\nHay decisiones de la juventud que marcan la vida entera, y la más importante, después de la fe, es con quién caminarás. La Biblia no es romántica en el sentido moderno: no habla de «encontrar a la persona perfecta», sino de construir una vida con alguien que mire en tu misma dirección. Dos personas que se aman pero no tienen un horizonte común terminan mirándose mucho y acompañándose poco. Dos personas que miran hacia Dios, aunque se quieran con torpeza, tienen una brújula.\n\nLa madurez, por su parte, trae la tentación contraria: la de creer que ya sabemos. Es la edad en que uno se instala en sus opiniones como en un sillón, y confunde la experiencia con la sabiduría. Pero hay una diferencia entre haber vivido mucho y haber aprendido mucho. Algunos tienen veinte años de experiencia; otros, un año de experiencia repetido veinte veces. La sabiduría exige seguir siendo discípulo.\n\nPor eso me gusta pensar en la edad media de la vida no como una cima, sino como una encrucijada. Desde allí se ve hacia atrás, lo que fue, y hacia adelante, lo que falta. Es el momento de poner en orden la casa, de reconciliarse con los que quedaron atrás, de dejar de postergar lo que importa. Y es también el momento de empezar a sembrar para otros. Un hombre o una mujer en la madurez que decide, como el sembrador del olivo, plantar para los que vienen, está entrando en la parte más fecunda de su vida."}, {"t": "Capítulo 13 · El menosprecio de los ancianos", "x": "Delante de las canas te levantarás, y honrarás el rostro del anciano.\n\n— Levítico 19:32\n\nHay sociedades que veneran a sus viejos y sociedades que los esconden. Las primeras suelen llamarse antiguas, y las segundas, modernas. En la antigüedad, el anciano era archivo, tribunal y memoria. Se le consultaba, se le escuchaba, y las canas eran corona. Nosotros hemos inventado algo más cómodo: los apartamos. Los jubilamos del respeto antes que del trabajo, los llamamos «carga» en voz baja, los ponemos en lugares limpios donde nadie se incomode con su lentitud, y los visitamos cada vez menos.\n\nLa Escritura es tajante. Manda levantarse delante de las canas y honrar al anciano. Dice que la corona de honra es la vejez que se halla en el camino de la justicia, y que la hermosura de los ancianos son sus canas. El salmista, ya viejo, ruega a Dios que no lo deseche en el tiempo de la vejez ni lo abandone cuando le falte la fuerza. Es una de las oraciones más conmovedoras de toda la Biblia, porque nombra el miedo más hondo de quien envejece: que lo dejen solo. Y Dios responde, por boca de Isaías, con una promesa que ningún hijo cumple del todo: hasta la vejez yo seré el mismo, hasta las canas os llevaré. El menosprecio al anciano es una forma de ceguera, porque olvida dos cosas. La primera: que el anciano es el que ha estado donde nosotros vamos. Job lo dijo, con una sencillez que desarma: en los ancianos está la ciencia, y en la larga edad, la inteligencia. Quien tiene un viejo a su lado y no le pregunta es como quien viaja a un país desconocido y desprecia al que ya lo recorrió. La segunda: que todos seremos eso. El que hoy aparta al anciano está ensayando, sin saberlo, su propia soledad.\n\nHay, además, algo que solo los años dan y que no se compra con títulos: la paciencia. Un joven se desespera ante lo que tarda; un viejo ha visto que lo que tarda a veces es lo que dura. Ha visto caer imperios, modas y promesas. Ha enterrado amigos. Ha perdonado y ha sido perdonado. Ha aprendido que casi todo lo urgente es poco importante y casi todo lo importante es poco urgente. Escucharlo es un acto de humildad que la vida entera nos agradecerá.\n\nY quiero decirte también lo que Dios hace con los ancianos, porque pocos lo cuentan. El salmista dice que los plantados en la casa del Señor aún en la vejez fructificarán, que estarán vigorosos y verdes. Joel promete que los ancianos soñarán sueños y los jóvenes verán visiones: en el Reino, cada edad tiene su don, y ninguna sobra. Y el último verso del Antiguo Testamento promete que el corazón de los padres se volverá a los hijos y el de los hijos a los padres. Esa es la cura: no un joven que reniega de su pasado ni un viejo que rezonga contra su futuro, sino dos generaciones que se reconocen mutuamente.\n\nHay una imagen que me gusta para cerrar este capítulo. En un huerto antiguo había un olivo tan viejo que nadie recordaba quién lo había plantado. Tenía el tronco retorcido, la corteza partida y una copa más bien escasa. Los jóvenes jardineros querían talarlo para poner en su lugar algo vistoso. Pero un día, un anciano que pasaba por ahí les pidió que esperaran a la cosecha. Cuando llegó el otoño, aquel árbol feo cargó más aceitunas que todos los demás juntos, y su aceite era el mejor de la comarca. Las raíces eran profundas, y bajo la tierra había lo que ninguna copa joven tiene todavía.\n\nLa Biblia está llena de ancianos que Dios usó en la última parte de su vida, y eso debería avergonzar a una cultura que jubila a la gente de la esperanza. Abraham tenía setenta y cinco años cuando recibió la llamada que cambió la historia. Moisés tenía ochenta cuando se le apareció la zarza. Caleb, a los ochenta y cinco, pidió que le dieran el monte más difícil, y lo conquistó. Y en el templo, cuando se presentó al niño Jesús, dos ancianos, Simeón y Ana, lo reconocieron cuando nadie más lo hizo. Habían esperado toda la vida, y por eso tenían los ojos listos.\n\nHay algo que solo los viejos pueden hacer: bendecir. Jacob, ya ciego, bendijo a sus nietos cruzando las manos, y su bendición guio generaciones. Cuando un anciano pone la mano sobre la cabeza de un niño y dice una palabra de bien, está dejando algo que no se puede comprar. Las familias que olvidan esto, que no piden la bendición de sus abuelos, que no dejan que los mayores oren por los jóvenes, pierden una riqueza que no figura en ninguna herencia.\n\nA los que están en la ancianidad quiero decirles algo con respeto: no se sientan una carga. La Biblia no los dice descartados; los llama coronados. Y si sienten que ya no tienen nada que ofrecer, tienen todavía lo más precioso: tiempo para orar. Hay ancianas que, sentadas\n\nen una silla junto a una ventana, han sostenido a familias enteras con su oración. Nadie lo sabe, salvo Dios y las familias. Y el día en que se abran los libros, se verá cuánto pesó esa silla junto a la ventana.\n\nA los jóvenes, en cambio, les digo: vayan a ver a sus abuelos. Siéntense. Pregunten. Escuchen la misma historia por tercera vez, que suele ser la mejor. Los ancianos no esperan sabiduría de ustedes; esperan compañía. Y a cambio de esa compañía les darán, sin darse cuenta, la sabiduría que no está en las pantallas."}, {"t": "Capítulo 14 · El consejo de los que ya caminaron", "x": "Reprende al sabio, y te amará.\n\n— Proverbios 9:8\n\nHay una cadena que no se ve y sin la cual ningún pueblo sobrevive: la que une a los que saben con los que van a saber. La Biblia la llama sabiduría, y la pone en la boca de los ancianos, de los padres y de los maestros. Quien recibe el consejo de quien ya caminó ese camino se ahorra años, lágrimas y entierros. Quien lo rechaza está obligado a descubrirlo todo por sí mismo, como si cada generación tuviera que inventar de nuevo el fuego.\n\nPero nadie recibe un consejo por el solo hecho de que se lo dan. Hace falta una cualidad que los libros de sabiduría llaman, con una palabra sencilla, docilidad: el deseo de ser enseñado. Es lo que distingue al sabio del necio. El necio, dice Proverbios, se cree recto a sus propios ojos; el sabio escucha el consejo. Parece una diferencia pequeña y lo es todo. Ante la misma corrección, uno dice «gracias» y el otro dice «¿quién eres tú para decirme?». Uno crece, el otro se endurece.\n\nHay un modo de amar que consiste en decir lo que el otro no quiere oír. Pocos lo hacen, porque cuesta. Es más fácil callar y dejar que la vida lo corrija, con más dureza y menos cariño. Pero la herida del amigo es fiel, dice la Escritura, y los besos del enemigo son importunos. Y sabio es el que sabe recibirla, y sabio es el que sabe darla con ternura, con el rostro en alto y sin humillar.\n\nPor eso este libro pone en primera línea el consejo, y pone a su lado la advertencia: no todo consejo es bueno. El mejor de los consejeros es el que ha pagado el precio de su propia verdad y no vende lo que no probó. Desconfía del que te dice «hazlo, no pasa nada» sin haberlo hecho. Y desconfía más aún del que te dice «nunca vas a lograrlo» sin haber intentado nada. El camino lo conocen los que lo caminaron, y los que lo caminaron nunca hablan de él a la ligera.\n\nLa Biblia nos da un ejemplo trágico de lo que pasa cuando se desprecia el consejo de los viejos. Roboam, hijo de Salomón, heredó el trono, y el pueblo le pidió que aligerara las cargas. Consultó primero a los ancianos, que habían servido a su padre, y le aconsejaron: sé servidor de este pueblo, háblales con bondad y te serán fieles. Pero a Roboam no le gustó el consejo. Fue a ver a los jóvenes con los que se había criado, que le dijeron: respóndeles que tu dedo meñique es más grueso que los lomos de tu padre. Roboam siguió a los jóvenes. Y el reino se partió.\n\nLa lección no es que los viejos siempre tengan razón ni que los jóvenes siempre se equivoquen. La lección es que hay que escuchar a quien ya pagó el precio del consejo que da, y desconfiar de quien nos dice lo que queremos oír. El poder sin consejo es un coche sin frenos, y la fama sin consejeros es un barco sin timón.\n\nCuando busques consejo, hazte tres preguntas. Primera: ¿esta persona vive lo que me dice? Segunda: ¿me habla con verdad y con amor, o solo con una de las dos? Tercera: ¿su consejo me acerca a Dios o me aleja de Él? Si la respuesta a las tres es sí, escúchala aunque te duela. Y si es no a alguna, ponla a prueba con calma.\n\nY cuando seas tú quien da consejo, ten el cuidado de quien camina en terreno sagrado. Cada palabra puede torcer una vida. No hables de lo que no conoces. No des órdenes:\n\nofrece luz. Dile a quien te pide consejo: «esto es lo que yo vi, esto es lo que yo haría, pero tú tienes que decidir ante Dios». Un buen consejero deja libre al que aconseja."}, {"t": "Capítulo 15 · Cuando no sé qué decir", "x": "Se sentaron con él en tierra siete días y siete noches, y ninguno le dijo palabra.\n\n— Job 2:13\n\nConfieso algo que quizás no se espera de un ministro: hay veces que no sé qué decir. He enseñado mucho. He aconsejado a muchos. He dado orientación, hombre como soy, a una madre sobre cómo criar a una niña, de cuyo mundo sé lo que me contaron y lo que alcanzo a imaginar. Y en esos momentos, cuando todos esperan una respuesta, uno tiene que sacarla de algún lado. Solo Dios sabe de dónde. Solo Dios sabe por qué a veces llega, y a veces no.\n\nLos amigos de Job nos dan la lección más sorprendente de toda la Biblia sobre el consuelo. Cuando llegaron y vieron a su amigo destruido, lloraron, rasgaron sus mantos y se sentaron junto a él en el suelo siete días y siete noches sin decir palabra. Fueron los\n\nmejores consoladores de la historia mientras estuvieron callados. Cuando empezaron a hablar, lo arruinaron todo.\n\nNo es que las palabras sean inútiles. Es que hay un orden. Primero se llega, después se calla, después se escucha, y solo entonces, tal vez, se habla. Pablo manda llorar con los que lloran, y es un mandamiento tan difícil como el de amar al enemigo, porque obliga al que consuela a bajar al hoyo del que sufre en lugar de gritarle desde arriba. El que se atreve a bajar no siempre sabe cómo volver a subir, y a veces ahí se encuentra con Dios. Por eso, cuando alguien me cuenta algo y no sé qué decir, he aprendido a decir lo único que es siempre verdad: aquí estoy. No tengo la respuesta, pero no me voy. Y casi siempre eso es más de lo que hacía falta. Tal vez la sabiduría de un ministro consista, sobre todo, en aprender cuándo callar. Las respuestas, si llegan, llegan en su momento. Las preguntas que no pude contestar me han enseñado más que muchas que sí contesté.\n\nCon el tiempo he hecho una lista, no escrita, de lo que no se debe decir a quien sufre. No lo digo con severidad, porque yo mismo he dicho casi todo lo de la lista. Pero la he aprendido a golpes.\n\nNo digas «todo pasa por algo», porque quien llora no quiere que le expliquen la razón de su dolor. No digas «Dios lo necesitaba más», porque suena a que Dios es un ladrón. No digas «al menos tuviste tanto tiempo juntos», porque le recuerdas lo que ya no tiene. No digas «yo sé cómo te sientes», porque no lo sabes: cada pérdida es única. No digas «tienes que ser fuerte», porque le estás exigiendo algo que no puede dar.\n\nQué sí se puede decir: «Lo siento muchísimo». «Aquí estoy». «No sé qué decirte, pero no me voy». «¿Quieres que me quede un rato?». «¿Quieres hablar de él?». Y a veces, nada: tomar la mano y esperar.\n\nEl ministerio de la presencia, que parece pequeño, es probablemente el más grande. En el Evangelio hay un momento que me estremece: en Getsemaní, antes de ser entregado, Jesús pide a sus tres amigos más cercanos que velen con Él. No que lo salven ni que le den una solución. Solo que velen. Y se durmieron. Lo que Jesús pedía era lo más sencillo y lo más difícil: que alguien no lo dejara solo.\n\nTambién aprendí que callar no es lo mismo que huir. Hay un silencio que acompaña, que respira junto al otro, que es oración sin palabras; y hay un silencio que escapa, que se esconde detrás de la incomodidad. Con el tiempo uno aprende a distinguirlos. El primero se queda; el segundo, a los cinco minutos, mira el reloj.\n\nSi algún día te toca estar junto a alguien que sufre y no sabes qué decir, recuerda a los amigos de Job. Durante siete días lo hicieron bien. No los imites en lo que vino después; imítalos en lo primero."}, {"t": "Capítulo 16 · Cómo se le habla a un ciego", "x": "Yo he venido a este mundo para juicio: para que los que no ven, vean, y los que ven, sean cegados.\n\n— Juan 9:39\n\n—¿Qué se hace con un mundo ciego? ¿Se le discute la luz, se le cuenta lo que se vio, o se lo toma de la mano?\n\nPregúntate qué hizo Jesús. A los ciegos que se le acercaron no les dio una conferencia sobre la óptica. A uno lo tocó. A otro le puso barro en los ojos. A otro lo tomó de la mano y lo sacó fuera de la aldea. Con cada uno fue distinto, pero con todos fue cercano. Y a los que ya creían que veían, y no veían, les dijo palabras duras. No era una cuestión de ojos, sino de corazón.\n\nEn hebreo, el corazón es lev. En griego, kardía. No es solo el sentimiento: es el asiento de la voluntad, de la inteligencia, de la emoción, de lo más hondo de uno. Cuando la Escritura dice que con el corazón oyen pesadamente, no habla de un oído malo. Habla de un hombre entero que se resiste a oír. Por eso no basta discutir. Los argumentos son útiles, y los usaremos, porque la fe no es enemiga de la razón. Pero el argumento convence a la cabeza, y el ciego es de corazón.\n\nPor eso, si hubiera que hablarle a un ciego como Jesús, yo lo tomaría de la mano. Le contaría lo que vi, sin exagerar, con las palabras que tengo. Y si me pidiera pruebas de la luz, le diría que no puedo hacer que la vea, pero sí que sienta su calor. El sol se siente aun por quien no lo ve.\n\nImagina, además, a un hombre que ha vivido siempre en una cueva y al que alguien le cuenta que afuera hay un sol. Se burlará, y con razón: nunca lo vio. Pero si el que se lo cuenta vuelve cada día con la piel un poco más tostada, con los ojos entrecerrados por la claridad, con el olor del campo en la ropa, el hombre de la cueva empezará a sospechar que ese testigo trae noticias de otra parte. Nuestro mejor argumento no es lo que decimos de la luz, sino lo que la luz hizo con nosotros.\n\nPorque la persona que está ante ti no es un caso, ni un debate pendiente. Es un hombre o una mujer con una historia, con dolores, con razones. Quien llega a ella con una argumentación impecable y ninguna compasión ha ganado una discusión y perdido un alma.\n\nHay un método que conviene aprender de Pablo en Atenas. Llegó a una ciudad llena de ídolos, y en lugar de insultar a los atenienses, empezó por reconocer lo bueno que había en ellos: veo que sois muy religiosos. Citó a sus poetas, no a los profetas judíos que no conocían. Se detuvo en un altar con una inscripción dedicada «al dios no conocido», y dijo: a ese que ustedes adoran sin conocer, yo se lo anuncio. Pablo no empezó por la ruptura, sino por el puente. Después sí llegó a la cruz y a la resurrección, y algunos se burlaron, y otros dijeron que lo oirían otra vez. Y unos pocos creyeron.\n\nEs una lección de método y de humildad. No todos creen, y no es culpa del mensajero. Pero cuando quien habla entra en el mundo del otro con respeto, la puerta al menos queda abierta. La mayoría de las discusiones religiosas se pierden porque nadie quiso escuchar primero.\n\nUna alegoría más, esta vez sobre cómo se conversa con quien está lejos. Un hombre, perdido de noche en una montaña, ve en la lejanía una luz tenue y camina hacia ella. Cuando se acerca, descubre que es una casa pequeña con una ventana encendida. No hay nadie en la puerta que lo regañe por haberse perdido ni que le explique el mapa de la sierra. Hay una mujer que abre y dice: «Pase, está helando». Le da una sopa. Le acerca una silla al fuego. Solo después, ya con las manos calientes, le pregunta de dónde viene. La luz no lo reprendió; lo guio. Y ese es el lugar que debe ocupar el cristiano en el mundo: una ventana encendida en la noche, no una linterna dirigida a los ojos del que pasa."}, {"t": "Capítulo 17 · Los cuatro amores", "x": "El amor es sufrido, es benigno; el amor no tiene envidia, el amor no es jactancioso.\n\n— 1 Corintios 13:4\n\nLlamamos amor a muchas cosas. Hollywood nos vende uno, el de la emoción que sube y sube, el del encuentro perfecto, el de las mariposas en el estómago. Es un amor que se siente, y por eso se acaba cuando se deja de sentir. Hay un segundo amor, que consiste en querer el bien del otro aunque cueste, aunque no haya ganas, aunque la otra persona haya cambiado. Los griegos lo llamaron ágape, y los cristianos entendimos que no es un sentimiento, sino una decisión sostenida por una fuerza que no es nuestra.\n\nUn escritor inglés, de los que me prestaron su manera de pensar, repartió el amor en cuatro y lo hizo con tanta claridad que cuesta no seguirle el paso. Los griegos tenían cuatro palabras, y cada una describe una habitación de la misma casa.\n\nLa primera es el afecto, storgé: el cariño tibio de lo familiar, el de la madre que lava la ropa de su hijo, el del perro que espera en la puerta, el del viejo sillón al que uno vuelve. No hace ruido. Es el amor de cada día, el que se nota solo cuando falta. Su peligro es hacerse posesivo: querer tanto a alguien que no lo dejas crecer.\n\nLa segunda es la amistad, filía: dos personas que miran en la misma dirección. A los enamorados los ves frente a frente; a los amigos, hombro con hombro, mirando algo que los reúne. Es un amor raro en esta época, porque exige tiempo, y el tiempo es lo único que ya no regalamos. Su peligro es hacerse pandilla: una amistad que se cierra sobre sí misma y desprecia a quien no entra.\n\nLa tercera es el eros, el amor del enamorado: ese que arde y que Dios inventó, no el diablo, aunque el diablo lo haya torcido. Fue idea de Él que un hombre y una mujer se desearan. El Cantar de los Cantares, un libro entero dedicado a eso, está en la Biblia sin pedir disculpas. Su peligro es hacerse dios: creer que la persona amada es la fuente cuando apenas es un cántaro.\n\nY la cuarta es la caridad, ágape: el amor que da sin esperar, el único de los cuatro que no depende de lo amable que sea el otro. Los demás son dones naturales; este es un don de arriba. Y lo curioso es que no destruye a los otros tres: los sana. Hace que el afecto no sea asfixia, que la amistad no sea pandilla y que el deseo no sea idolatría.\n\nSi quieres saber qué es amar de verdad, mira a un Dios que entrega a su Hijo. No hay ateo que no llore cuando muere un ser querido; en ese llanto sabe lo que es amar. Pues Dios entregó al suyo. Y lo entregó no por un mundo bueno, sino por un mundo que lo escupió. Cuando alguien me pregunta qué es el amor, no le hablo de teorías: le hablo de una cruz. El amor falso busca algo del otro: compañía, aprobación, seguridad, placer. El verdadero busca al otro. El falso dice: te necesito para ser feliz. El verdadero dice: quiero que seas todo lo que Dios soñó para ti, aun si eso me cuesta. El falso se alimenta de lo que recibe. El verdadero vive de lo que da. El primero se cansa cuando se acaba la novedad; el segundo empieza, precisamente, cuando se acabó.\n\nHay un amor que se prueba en el sufrimiento. Quien cuida a una persona enferma, a quien ya no lo recuerda, a quien ya no responde, sabe que el verdadero amor no es un sentimiento que se tiene, sino una fidelidad que se paga. Es el amor de quien tomó la mano y no la soltó. Esa clase de amor no es una excepción a las leyes del mundo; es la pista de que hay otro mundo detrás.\n\nVale la pena detenerse un poco más en cada uno de los cuatro amores, para ver qué hace falta para que no se corrompan.\n\nEl afecto necesita, ante todo, ser dicho. Hay familias donde nadie ha dicho «te quiero» en veinte años, y se dan por sobreentendidos los abrazos. Pero lo que no se dice a veces no se oye. El afecto también pide perdón, porque donde hay confianza hay roce, y sin perdón el roce se vuelve herida. Y pide límites: querer a alguien no es tener derecho a controlarlo. La amistad necesita tiempo y verdad. Dos amigos que no se dicen la verdad terminan siendo conocidos. Pero dos amigos que se dicen la verdad con cariño pueden ser, uno para el otro, el mejor regalo de Dios. Salomón escribió que el amigo ama en todo tiempo y que el hermano nace para tiempo de angustia. Si tienes uno, cuídalo; si no tienes ninguno, pídelo. El eros necesita compromiso. El mundo moderno ha separado el deseo del pacto, y el resultado es una generación que desea mucho y se compromete poco. La Biblia lo une: el hombre dejará a su padre y a su madre, y se unirá a su mujer, y serán una sola carne. No porque el deseo sea malo, sino porque es demasiado grande para dejarlo sin hogar. Un fuego sin chimenea quema la casa; un fuego en la chimenea la calienta.\n\nY el ágape necesita fuente. No se puede dar lo que no se ha recibido. Quien intente amar por pura fuerza de voluntad se agotará pronto. Por eso Juan escribe que nosotros amamos porque Él nos amó primero. El ágape no se fabrica; se recibe y se pasa.\n\nPiensa en un árbol con cuatro ramas grandes. Cada una da su fruto, y cada una es hermosa por sí misma. Pero las cuatro nacen del mismo tronco y beben de las mismas raíces. Quita las raíces y las ramas se secan. El ágape es la raíz. Los demás amores, sin raíz, se vuelven hojarasca; con raíz, dan sombra."}, {"t": "Capítulo 18 · La verdadera fe y la credulidad", "x": "Es, pues, la fe la certeza de lo que se espera, la convicción de lo que no se ve.\n\n— Hebreos 11:1\n\nSe confunde mucho la fe con la credulidad. La credulidad es creer sin preguntar. La fe es creer después de haber preguntado, y seguir preguntando mientras se cree. La credulidad se rompe ante la primera objeción. La fe se vuelve más profunda ante cada una.\n\nLa credulidad suele ser un hábito de repetir lo que otro dijo. Repetir de memoria es ser una grabadora. Creer por revelación o por meditación es otra cosa: es haber hecho propio lo que otro te dio. Yo me sé de memoria capítulos enteros de la Escritura, pero la memoria no es la fe. La fe es lo que queda cuando el versículo se te cae de la memoria y sigue en pie el Dios que lo dijo.\n\nQue el cristianismo sea el cuento de hadas verdadero, como le mostró un amigo a otro en una noche famosa, no significa que sea un cuento. Significa que los mitos de todos los pueblos, con sus dioses que mueren y resucitan, con sus reyes que vuelven, con sus héroes que bajan a los infiernos, eran la sombra de algo. Y que ese algo ocurrió una vez, en un lugar y en un tiempo, bajo un gobernador. Por eso quien lo desprecia sin haberlo leído se parece a quien habla de un país sin haberlo pisado.\n\nHay una pregunta que me parece decisiva: ¿se necesita tanta fe para creer que Dios existe como para creer que no existe? Aquí conviene ser honesto. No es simétrico. Quien afirma tiene que probar, y quien niega también. Cada lado carga con lo suyo. No empates la discusión: argumenta. Y confía en que quien argumenta con honradez, con el tiempo, descubre algo.\n\nUn ejemplo sencillo. Cuando te sientas en una silla, no analizas sus patas ni calculas su resistencia: confías en ella y te sientas. Si se rompe, descubres que tu fe era credulidad. Si aguanta, aprendes que era confianza. La fe cristiana no te pide sentarte a ciegas; te pide mirar la silla, probarla, saber quién la hizo, y entonces sentarte. Y mientras más te sientas, más conoces su firmeza.\n\nLa fe verdadera no es el esfuerzo de creer lo que uno no cree. Es la confianza de quien se apoya en alguien que ya demostró ser digno. Es un cheque en blanco entregado a quien sabemos que no defrauda. Y, como todo cheque, solo se conoce su valor el día que se cobra.\n\nLa fe, además, no se opone a la ciencia, como muchos piensan. Se opone, en todo caso, a una filosofía que se disfraza de ciencia: la que afirma que solo existe lo que se puede medir. Pero esa afirmación misma no se puede medir. La ciencia moderna nació, en buena parte, de hombres que creían que el universo era ordenado porque había sido hecho por un Dios ordenado. Kepler decía que pensaba los pensamientos de Dios tras Él. Newton escribió más sobre teología que sobre física. No eran ingenuos; eran creyentes.\n\nHay preguntas que la ciencia no contesta y no pretende contestar: por qué hay algo y no nada, qué es lo bueno, para qué vivimos, qué hay después de la muerte. Son preguntas que la ciencia deja en la puerta, no porque no importen, sino porque su método no las alcanza. Y quien dice que no importan está mintiendo, porque todos vivimos de la respuesta que les damos, aunque sea sin pensarlo.\n\nHay también una confusión frecuente entre fe y certeza. Se piensa que el creyente es el que no duda. Pero la Biblia está llena de gente que creyó y dudó a la vez. Un padre desesperado le dijo a Jesús: «Creo; ayuda mi incredulidad». Es una de las oraciones más honestas del Evangelio, y fue respondida. No pidió que se le quitara la duda para creer; pidió ayuda desde adentro de su duda. Y Jesús lo escuchó.\n\nPor eso me atrevo a decirte, si estás en medio de una crisis de fe: no te escandalices. Pregunta. Lee. Habla con alguien que haya pasado por lo mismo. Y sigue orando, aunque sea con la misma frase de aquel padre. Dios no se ofende con las dudas de quien lo busca. Se ofende, si acaso, con la indiferencia de quien no lo busca."}, {"t": "Capítulo 19 · El ateísmo práctico y el silencio", "x": "Estad quietos, y conoced que yo soy Dios.\n\n— Salmo 46:10\n\nHay ateos de teoría y hay ateos de práctica. Los primeros dicen que Dios no existe. Los segundos dicen que sí, y viven como si no. Estos últimos son mucho más numerosos, y entre ellos hay muchos que asisten a una iglesia. Lo que se cree se nota en lo que se hace con el dinero, con el tiempo, con la boca y con el prójimo. Un hombre que cree que Dios existe y no lo consulta jamás, no lo agradece, no lo teme ni lo ama, es un ateo de buenos modales.\n\nY hay un fenómeno aún más curioso. Hay quienes no pueden estar en silencio. Necesitan que haya siempre algo sonando: la televisión, el celular, la música, una conversación. No es que les guste el ruido. Es que no se soportan. Su propio silencio los acusa. Cuando uno no puede estar a solas consigo mismo, ni siquiera es buena compañía para sí.\n\nPascal lo vio hace siglos: gran parte de la desgracia del hombre viene de que no sabe quedarse tranquilo en una habitación. Corre tras la diversión para no mirar lo que hay del otro lado de la puerta. Y lo que hay del otro lado de la puerta es el umbral. No es raro, entonces, que el hombre moderno, con tanto ruido, haya aprendido a no llorar a sus muertos, a taparlos, a pasar rápido por el cementerio.\n\nEl desierto enseña lo contrario. En el desierto no hay ruido que lo tape. Y ahí, en el silencio, me encontré con Alguien. Dicen que el silencio da miedo, y es verdad. Pero lo que da miedo no es el silencio, sino la ausencia de Aquel que podría llenarlo. Para quien lo tiene, el silencio no es vacío: es conversación.\n\nA quien no puede estar callado, le diría que se anime. Una noche, sin pantalla, sin música, sin nadie. Que diga en voz baja: aquí estoy. Es posible que se oiga una respuesta.\n\nPiensa en una ciudad que nunca duerme. Tiene luces de todos los colores, motores que no se apagan, pantallas en cada esquina. Sus habitantes presumen de no parar jamás. Pero hay en las afueras una casa pequeña, con una ventana abierta, y quien pasa de noche por\n\nallí oye algo que en el centro nadie oye: el sonido del propio corazón. Algunos entran por curiosidad, se sientan, y se quedan llorando sin saber por qué. No lloran de tristeza. Lloran porque han recordado que existen.\n\nEl silencio no es un enemigo. Es una casa a la que hace tiempo que no volvemos.\n\nEn el Evangelio hay una frase que me parece la mejor guía para los tiempos ruidosos. Jesús, después de largas jornadas con la multitud, se retiraba a lugares apartados a orar. Los discípulos lo buscaban, y Él, a menudo, estaba solo. Quien tenía todo el poder del cielo no se creyó dispensado de la soledad. Si Él necesitaba retirarse, ¿cuánto más nosotros? Sugiero una práctica, y no pretendo que sea más que eso. Un rato cada día, el más corto que puedas, apaga lo que suene. Siéntate. Respira. Di en voz baja: «Señor, aquí estoy». No pidas nada al principio. No expliques nada. Solo estate. Los primeros días el ruido interior será peor que el de afuera; la mente salta, el cuerpo se inquieta, aparecen recuerdos que habías enterrado. No te asustes. Es la superficie del agua agitada. Con el tiempo, la superficie se asienta, y empiezas a ver lo que hay debajo.\n\nAlgunos descubrirán que lo que había debajo era dolor, y lloraran. Otros descubrirán gratitud. Otros, simple silencio. Todos, si perseveran, descubrirán que hay Alguien que escucha. No siempre se oye una voz. A veces es un descanso, a veces una idea limpia, a veces una paz que llega sin invitación. Los antiguos lo llamaban presencia.\n\nHay una frase de un antiguo salmo que repito muchas noches: «Mi alma tiene sed de Dios, del Dios vivo». Es una frase de sed, no de saciedad. Y es hermoso que esté en la Biblia, porque nos permite orar desde donde estamos, sin fingir plenitud. Dios no exige que lleguemos llenos; basta con que lleguemos sedientos."}, {"t": "Capítulo 20 · El perdón", "x": "Perdónanos nuestras deudas, como también nosotros perdonamos a nuestros deudores.\n\n— Mateo 6:12\n\nHay una verdad incómoda que casi todos descubrimos tarde: se puede cargar un resentimiento durante años como quien carga una piedra, convencido de que se la está tirando al otro. La piedra la lleva uno. Y el otro, muchas veces, ni siquiera lo sabe.\n\nJesús contó una historia que me parece una de las más duras de los Evangelios. Un siervo debía una suma imposible, de esas que no se pagan en una vida entera. El rey, movido a compasión, se la perdonó toda. Y el siervo, al salir, encontró a un compañero que le debía unas pocas monedas, lo agarró del cuello y lo hizo encarcelar. Cuando el rey se enteró, no lo felicitó por su coherencia. El perdón recibido que no se convierte en perdón dado es un perdón que no se entendió.\n\nPerdonar no es olvidar. Tampoco es decir que lo que pasó no importó, ni volver a abrir la puerta a quien nos dañó, ni fingir que ya no duele. Perdonar es cancelar una deuda que tenías derecho a cobrar, y entregarle al Juez justo lo que nunca te tocó juzgar a ti. Es soltar la piedra. A veces se perdona una sola vez; a veces, como dijo Jesús, setenta veces siete, porque la herida se abre cada mañana y cada mañana hay que cerrarla.\n\nHay algo más, y lo digo con cuidado: a veces el que hay que perdonar es uno mismo. Hay quien carga con lo que hizo o con lo que dejó de hacer, y se sienta a juzgarse con una dureza que no usaría con nadie. Pero Dios no pone su vara más alta que la de su propio Hijo. Si Él te declara limpio, ¿con qué autoridad vas a seguir cobrándote tú?\n\nY una cosa más, la más difícil: se perdona de a poco. No esperes sentir primero. Decídelo, aunque te tiemble la voz, y deja que el sentimiento llegue después, como llega el pan tras la siembra.\n\nNo quiero que el perdón suene a una receta fácil, porque no lo es. Hay heridas tan hondas que perdonar parece una traición a uno mismo. Piensa en quien fue abandonado por su padre, o traicionado por quien más amaba, o dañado en su niñez por alguien que debía protegerlo. A esa persona, jamás le diré «perdona y olvida». Le diré: lo que te hicieron estuvo mal, y tienes derecho a tu dolor. El perdón cristiano no minimiza el daño; lo nombra con todas sus letras, y precisamente por eso lo puede soltar.\n\nImagina una balanza antigua, de dos platillos. En uno, la deuda del otro con todo su peso. En el otro, nada. Mientras la balanza esté así, el resentimiento tiene razón: el otro te debe. Pero cuando decides perdonar, no vacías el primer platillo: colocas en el segundo la cruz. De pronto la balanza queda equilibrada, no porque tu herida no pesara, sino porque hay un peso mayor que la compensa. Quien perdona no dice «no me importó»; dice «Alguien ya pagó esto».\n\nTambién hay que aclarar la diferencia entre perdonar y reconciliarse. El perdón es unilateral: puedes perdonar a quien ya murió, a quien nunca pidió perdón, a quien sigue siendo peligroso. La reconciliación requiere dos: arrepentimiento por un lado, confianza reconstruida por el otro. Si la persona que te hirió sigue siendo un riesgo para ti, puedes perdonarla y mantener la distancia. Perdonar no es volver a poner la mano sobre la llama. Y cuando el resentimiento regrese, que regresará, no te desesperes. Perdonar es una decisión que se renueva. Cada vez que el recuerdo te hiera, vuelve a decir: «Ya está entregado». Con el tiempo, el recuerdo duele menos, y un día descubres que puedes\n\npensar en quien te hirió sin que te aprieten el pecho. Ese día no sabrás cuándo empezó; solo sabrás que hace tiempo que soltaste la piedra."}, {"t": "Capítulo 21 · A las almas rotas, y de las almas rotas", "x": "Una caña cascada no quebrará, y el pabilo que humea no apagará.\n\n— Isaías 42:3\n\nHay un modo de hablar que no es el del teólogo ni el del filósofo, sino el del hermano que se sienta al lado. Es el modo en que hay que hablarle al alma rota. Y esa es toda alma, en algún momento.\n\nSe habla distinto a un ministro que a un pescador. A un teólogo catedrático se le habla de la historia del texto, de las lenguas, de las disputas de los concilios. A un iletrado se le habla con una imagen, con una parábola, como hacía Jesús. A un pescador rudo se le dice sígueme, y se le deja que descubra el resto. Quien sabe de letras no es más amado; quien no las sabe no es menos. Lo que cambia es el lenguaje, no el Evangelio.\n\nSe habla distinto a un hijo que a una madre, a un padre que a una hija, a un amigo que a un siervo. Pero hay una regla que se mantiene: se habla con verdad y con ternura, sin sacrificar ninguna de las dos. Quien dice la verdad sin ternura hiere. Quien da ternura sin verdad engaña.\n\nA los borrachos hay que hablarles sin asco. A las prostitutas, sin juicio: Jesús conversó con la mujer del pozo y con la mujer que iban a apedrear, y a ninguna le negó la verdad ni la dignidad. A los pecadores, que somos todos, sin disfraz. A los inmundos, con la mano extendida como la de quien tocó al leproso. A los comunes, con la alegría de saber que Dios se fija en los comunes. A los que Dios ya limpió, con la advertencia de no olvidar de dónde fueron sacados.\n\nY a los que están en soledad, tapando su propio silencio, con paciencia. Quien llega con prisa no será oído. Quien se sienta, y calla, y escucha, ha empezado a hablar.\n\nHablar de las almas rotas es otra cosa. Es admitir que uno es una. Que el que habla desde el púlpito también tiene grietas, y que Dios no necesita jarras perfectas, sino jarras dispuestas. Los quebrados no somos un caso especial. Somos la regla. Y Dios se especializa en reparar lo roto.\n\nHay un arte japonés, el kintsugi, que consiste en reparar la cerámica rota rellenando las grietas con oro. La pieza no se esconde: la fractura queda a la vista, dorada, como parte de su historia. Una taza reparada así no vale menos; vale más. Yo no sé si el arte lo pensó con intención cristiana, pero me parece una parábola perfecta. Dios no remienda a escondidas. Rellena con oro las grietas, y las deja ver, y de ahí hace su belleza.\n\nEl apóstol Pablo, que fue un hombre bien roto, escribió que Dios nos consuela en todas nuestras tribulaciones para que podamos consolar a los que están en cualquier tribulación, con el mismo consuelo con que nosotros somos consolados. Esa es la economía del dolor en el Reino: nada se desperdicia. La herida que Dios sanó en ti es una llave que abrirá otras puertas. Quien pasó por la depresión puede sentarse con el deprimido sin darle recetas. Quien enterró a un hijo puede acompañar a otro padre sin decir nada. Quien fue abandonado puede decirle al abandonado: yo sé de qué hablas, y hay salida.\n\nA ustedes, los que se sienten demasiado rotos para ser útiles, les digo con certeza que están equivocados. Dios no busca piezas perfectas para sus obras. Busca vasijas disponibles. Y cuanto más rota está la vasija, más claro se ve que la luz que sale no es de ella.\n\nEscribe tu historia, aunque sea en un cuaderno que nadie lea. Cuéntala a un amigo. Dila, si Dios te da la ocasión, desde un púlpito, desde una mesa, desde un hospital. Una historia contada con honestidad es una lámpara más en la noche de alguien. Y no hace falta que sea brillante; solo hace falta que sea verdadera."}, {"t": "Capítulo 22 · El problema del dolor", "x": "De oídas te había oído; mas ahora mis ojos te ven.\n\n— Job 42:5\n\nHasta aquí hemos hablado de la grieta, del desierto y de la fuente como quien traza un mapa. Pero un mapa no sirve de mucho cuando uno está sufriendo. Cuando duele, no se quiere una teoría: se quiere que pare. Y sin embargo la pregunta llega, siempre, a las tres de la madrugada: si Dios es bueno y todopoderoso, ¿por qué esto?\n\nNo voy a pretender que tengo la respuesta. Hay libros enteros que lo intentan, y los he leído, y alguno me ha ayudado. Un autor inglés que perdió a su mujer escribió dos veces sobre el tema: una con la cabeza fría y otra con el corazón abierto. La primera sirve para pensar; la segunda, para no sentirse solo. Y aprendí que ambas son necesarias, y que quien tiene solo una se queda cojo.\n\nLo que sí puedo decirte es lo que la Biblia hace con el dolor, que es sorprendente. No lo niega, y no lo adorna. El libro de Job es una larga discusión sobre el sufrimiento sin explicación, y al final Dios no responde con una teoría. Responde con una presencia. Le habla a Job desde el torbellino, y Job, que había pedido razones, termina diciendo que antes solo había oído hablar de Dios, y que ahora lo ve. No le dieron un argumento. Le dieron un rostro.\n\nImagina un taller de escultura. Un bloque de mármol, recién llegado de la cantera, ve entrar al escultor con un martillo y un cincel. Al primer golpe grita. Al segundo, protesta. Al tercero, jura que ese hombre lo odia. Cada trozo que cae al suelo es un pedazo de sí mismo que pierde. No entiende qué quiere de él. Ni siquiera sabe que adentro hay un rostro, una mano levantada, un gesto de ternura. El escultor, en cambio, ve la figura terminada, y por eso golpea con cuidado, y quita únicamente lo que sobra. El mármol, que solo siente el golpe, concluye que el dolor es lo único que existe. El escultor, que mira el rostro, sabe que el dolor es el camino.\n\nCuidado: la alegoría tiene un límite. No todo sufrimiento es un cincel, y no hay que decirle a quien llora que Dios lo está puliendo. Hay dolores que simplemente son una desgracia, y la Biblia los llama así. Lo que sí podemos decir es que ningún dolor está fuera de las manos de Dios, y que Él mismo entró en el taller. En la cruz, el Escultor se dejó cortar. Esa es la respuesta más honda que conozco: no que Dios explique el sufrimiento, sino que lo comparta.\n\nPor eso, cuando alguien me pregunta por qué sufre, ya no empiezo por argumentos.\n\nEmpiezo por decirle que no está solo, y que el Dios en quien creo conoce el clavo por dentro. Después, si quiere, hablamos de razones. Casi nunca las pide.\n\nHay una cosa más sobre el dolor que quiero decir, y es sobre su dimensión corporal. Los salmos no son poemas abstractos: están llenos de huesos que se consumen, de ojos que se deshacen en lágrimas, de gemidos que cansan. El sufrimiento se vive en el cuerpo, y el cuerpo necesita atención. A veces la espiritualidad mal entendida ignora el sueño, la comida, el descanso, el aire fresco, el abrazo. Elías, en el desierto, necesitaba antes que nada pan y siesta. Hay cuadros de agotamiento que no se curan con más oración, sino con más descanso; hay tristezas que necesitan, junto a la fe, un médico o un terapeuta. Y no hay deshonra en buscarlos. Dios sana por manos, y algunas de esas manos llevan bata blanca.\n\nQuiero también hablar, con cuidado, de los que sufren por causa de otros: de los que fueron heridos por la crueldad humana. Aquí el problema del dolor se vuelve más agudo, porque a la pregunta «¿por qué Dios lo permite?» se suma la pregunta «¿por qué ellos lo hicieron?». La Escritura no minimiza el mal que hacen los hombres. Lo llama pecado, lo llama injusticia, y promete que Dios juzgará. Hay una frase del Apocalipsis que me conmueve: Dios enjugará toda lágrima. Toda. Las que cayeron en silencio, las que nadie vio, las que fueron causadas por quien no lo pagó en esta vida. Ninguna se perderá.\n\nQuien sufre injusticia necesita saber que hay un Juez. No es una frase vacía: es lo que permite no hacerse justicia por mano propia, porque se confía en que la balanza final no se ha roto. La esperanza cristiana no es resignación, es confianza activa: seguiré haciendo el bien, denunciando el mal, protegiendo al débil, porque sé que Alguien más grande que yo tiene la última palabra."}, {"t": "Capítulo 23 · La esperanza: la nostalgia de un país que no hemos visto", "x": "Pero ahora anhelan una mejor, esto es, celestial.\n\n— Hebreos 11:16\n\nHay una sensación que casi todos hemos tenido y casi ninguno sabe nombrar. Aparece en una tarde de otoño, en una frase de música, en un paisaje que nunca habíamos pisado y que sin embargo nos suena a casa. Es un anhelo agudo, dulce y doloroso a la vez, de algo que no sabemos qué es. Cuando llegamos a lo que creíamos desear, la sensación se desvanece, y descubrimos que el objeto no era eso. Era otra cosa, más lejos.\n\nUn escritor inglés pasó media vida tratando de describirla, y concluyó algo que me parece de una honestidad conmovedora: si encuentro en mí un deseo que nada de este mundo puede satisfacer, la explicación más probable es que fui hecho para otro mundo. Los hambrientos no inventaron el pan por casualidad; el pan existe porque el hambre es real. Los sedientos descubren el agua. Y los nostálgicos de otro país tienen, probablemente, una patria.\n\nCuentan de un niño nacido y criado en tierra extranjera, de padres desterrados, que jamás había visto el país de sus mayores. Pero cada noche, en la cocina de la casa, los oía hablar de montañas y de ríos, de una música que se tocaba en las fiestas, de un olor a pan en las mañanas de invierno. El niño nunca estuvo allí, y sin embargo, cuando oía esas historias, algo en el pecho se le encogía. Ya de hombre, cuando por fin pudo viajar, bajó del tren en\n\nuna estación desconocida, respiró hondo, y comprendió sin que nadie se lo dijera que estaba volviendo. Nadie vuelve a un lugar donde nunca estuvo, salvo que el lugar lo haya estado esperando.\n\nEsa es la esperanza cristiana. No es un optimismo, ni una forma de decir que las cosas saldrán bien. Es la certeza, fundada en una resurrección ocurrida, de que el país adonde vamos existe, de que fuimos hechos para él, y de que alguien nos espera en la puerta. La Escritura lo llama patria mejor, ciudad con fundamentos, herencia incorruptible. Y el último libro de la Biblia, que no es un libro de miedo sino de bodas, la describe con el lenguaje que tenemos: oro, cristal, agua, luz, sin lágrimas ni muerte ni llanto.\n\nHay que decir también lo que esa esperanza no es. No es una evasión. Quien espera el cielo no desprecia la tierra: la cuida mejor, porque sabe que será renovada y no destruida. Tampoco es un consuelo barato. A la viuda que acaba de enterrar a su marido no le sirve un «ya está en un lugar mejor». Le sirve que alguien se siente a su lado y llore. La esperanza llega después, cuando el llanto ha cumplido su tarea, y llega, no como una frase, sino como un amanecer.\n\nY por último, la resurrección del cuerpo. Los cristianos no esperamos ser espíritus flotando en una nube. Esperamos, como esperaba Pablo, un cuerpo glorioso, semejante al de Cristo resucitado, que comía pescado junto al lago y tenía las marcas de los clavos. Es decir, esperamos ser lo que somos, sin el quebranto. Esperamos reconocernos.\n\nEsperamos reconocerlos a ellos.\n\nCuando murió mi pareja, uno de los pensamientos que más me sostuvo fue este: que la separación, siendo real, es provisional. No es un consuelo del tipo «eso piensan los que no aceptan la realidad». Es una convicción que se apoya en un hecho concreto: Cristo resucitó. Si ese hecho es verdad, la muerte no es el final de la historia; es un capítulo. Y si es mentira, entonces, como dice Pablo, somos los más dignos de lástima. Todo el cristianismo cuelga de ese clavo. No temo ponerlo así de claro.\n\nLos testigos que dijeron haber visto al resucitado no eran gente crédula ni ansiosa de gloria. Eran pescadores asustados que habían huido el viernes, y que el domingo se jugaron la vida por afirmar lo contrario de lo que habían pensado. Nadie muere por lo que sabe que es mentira. Esos hombres murieron en su mayoría por seguir diciendo: lo vimos. Esa continuidad, en una religión nacida en el lugar y la época de los hechos, no tiene mejor explicación que la que ellos mismos dieron.\n\nPero el argumento no es todo. Hay una razón más honda: la resurrección no es una prueba que se examina, sino una persona con la que se vive. Quien ha encontrado a Cristo en la oración, en la lectura, en la comunidad, en el dolor, en la alegría, sabe, con una certeza distinta a la del laboratorio, que Él vive. No se lo puede demostrar a nadie con una probeta, pero tampoco se puede dudar de que un amigo vive cuando uno conversa con él cada día.\n\nY así se explica que los cristianos hayan cantado en las catacumbas, en las cárceles, en las hogueras. No era bravuconería. Era esperanza. Una esperanza que no es creer en que todo saldrá bien, sino saber en Quién se apoya cuando todo sale mal."}, {"t": "Capítulo 24 · La mesa larga", "x": "Cordón de tres dobleces no se rompe pronto.\n\n— Eclesiastés 4:12\n\nUna brasa sola se apaga. Es una de las leyes más sencillas del fuego, y la sabe cualquiera que haya encendido una chimenea. Sácala del montón, déjala a un lado, y verás cómo en unos minutos se le va el rojo y queda gris, fría, inútil. Vuelve a ponerla entre las otras, y en un rato arde otra vez. No cambió su naturaleza. Cambió su compañía.\n\nAsí es el creyente sin comunidad. Hay quien dice que puede amar a Dios solo, en la montaña, en su cuarto, bajo las estrellas, y no lo discuto: Dios se encuentra en todas partes. Pero la Escritura no conoce un cristianismo de ermitaño. Habla de un cuerpo, con muchos miembros, donde el ojo no puede decirle a la mano que no la necesita. Habla de una casa, de una familia, de un pueblo. Y cuando Jesús quiso dejarnos algo antes de irse, no nos dejó un libro de reglas: nos dejó una mesa, con pan y con vino.\n\nTe confieso algo que sé desde el púlpito. La Iglesia es la parte más difícil de la fe. Porque a Dios uno lo puede imaginar como quiera, pero a los hermanos los tiene delante, con sus manías, su mal carácter, sus chismes, sus heridas mal curadas. He visto iglesias que hirieron más que cualquier enemigo. He visto pastores, yo incluido, que prefirieron la fachada a la verdad. Y he visto también lo contrario: una mesa larga, con gente muy distinta, donde nadie preguntó primero quién eras sino cuánta hambre traías.\n\nLa Iglesia no es un club de gente perfecta. Es un hospital de campaña: llegan los heridos, y los que ya sanaron se quedan a vendar a los que llegan. Quien busca una iglesia sin defectos no la encontrará, y si la encuentra, debería abstenerse de entrar, porque con él dejaría de ser perfecta. Pero quien busca una comunidad honesta, donde los pecadores se confiesan, los débiles se apoyan y los fuertes aprenden a ser mansos, tiene mucho camino andado.\n\nHay una alegoría que me gusta. Imagina una larga mesa puesta en un campo, con el pan recién hecho en el centro. Los comensales llegan de todas partes: un anciano con bastón, una madre con un niño dormido en brazos, un obrero que viene sucio del trabajo, un joven que nunca creyó, una viuda que sigue creyendo con la voz rota. Nadie eligió a su vecino de\n\nasiento. Pero cuando se parte el pan y se pasa de mano en mano, una cosa se hace evidente: la mesa no es de ninguno. El Anfitrión es Otro, y con ese Otro todos son de la casa.\n\nSi te has alejado de una iglesia porque te hirieron, no te voy a decir que vuelvas con los ojos cerrados. Te voy a decir que busques, que pruebes otra mesa, que no confundas el rostro de Dios con el de quien lo representó mal. La brasa que se apagó no está perdida: necesita calor. Y casi siempre hay una chimenea cerca.\n\nHay también un llamado a los que estamos dentro de la Iglesia, y es el de recibir mejor. Hemos hablado de los que se fueron; hablemos de los que llegan. Nada hiere más a un recién llegado que ser mirado de arriba abajo, o ignorado en la puerta, o interrogado sobre su pasado antes de que le sirvan el café. Una iglesia que no sabe recibir no está viviendo lo que predica.\n\nImagina a una joven que entra, por primera vez, a una reunión un domingo. Viene de una noche difícil, de una discusión con su madre, de un matrimonio que se rompe. Se sienta al fondo, con los ojos bajos. Tiene miedo de que alguien le pregunte demasiado, y miedo de que nadie le pregunte nada. Si ese día alguien le sonríe sin presumir, le ofrece un lugar, le sirve un vaso de agua y no le exige nada, esa joven puede quedarse años. Si ese día nadie la ve, no volverá. La diferencia entre las dos escenas es de treinta segundos y una sonrisa. La hospitalidad, dice la Escritura, es un mandamiento tan serio que algunos, sin saberlo, hospedaron ángeles. Cada recién llegado puede ser un enviado, o puede ser Cristo mismo disfrazado de forastero. «Fui forastero, y me recogisteis», dice. Y los justos, asombrados, preguntan cuándo. Es la gran sorpresa de todos los tiempos: que lo que hicimos al más pequeño, a Él se lo hicimos.\n\nPor eso me gusta pensar que una iglesia sana es, sobre todo, una mesa con las puertas abiertas. Se predica la verdad, se canta, se ora, se estudia; pero todo eso ocurre en torno a una mesa donde hay lugar para uno más. Y siempre hay uno más. Dios se encarga de enviarlo."}, {"t": "Capítulo 25 · El viento y la lámpara", "x": "El viento sopla de donde quiere, y oyes su sonido; mas ni sabes de dónde viene, ni a dónde va; así es todo aquel que es nacido del Espíritu.\n\n— Juan 3:8\n\nDesde el principio de este libro hablamos de una lámpara. Pero una lámpara, por hermosa que sea, no se enciende sola. Necesita aceite.\n\nJesús contó la parábola de diez doncellas que salieron a esperar al esposo, cada una con su lámpara. Cinco llevaron aceite de sobra y cinco no. El esposo tardó, todas se durmieron, y a medianoche resonó el grito de que llegaba. Las cinco necias descubrieron entonces que sus lámparas se apagaban, y salieron corriendo a comprar lo que debieron haber traído. Cuando regresaron, la puerta estaba cerrada. No se trata de una lección sobre moralidad. Se trata de reservas: de qué hay dentro cuando la noche se alarga y el esposo tarda.\n\nPara mí, ese aceite es el Espíritu Santo. No es una fuerza abstracta, ni un sentimiento, ni un adorno para ocasiones especiales. Es una Persona, la tercera de la Trinidad, que habita a los creyentes. Es el que consuela, el que recuerda lo que Jesús dijo, el que intercede con gemidos indecibles, el que reparte dones como quiere. Pablo habla de sabiduría, de fe, de sanidades, de milagros, de profecía, de discernimiento, de lenguas y de su interpretación. Yo creo que esos dones no se acabaron con los apóstoles, y esa es mi lectura. Otros hermanos, tan amantes de la Escritura como yo, leen esos pasajes de otro modo, y no por eso dejan de ser mis hermanos.\n\nPero déjame decirte algo que quizá no esperas de un pentecostal. Los dones no son un espectáculo. Pablo, en la misma carta donde los enumera, escribe un capítulo entero sobre el amor, y dice que si hablara lenguas humanas y angélicas sin amor, sería metal que resuena. Y en otro capítulo pide que todo se haga decentemente y con orden. El fuego sin leña es humo; el fuego sin hogar es incendio. El Espíritu no viene a que uno se luzca, sino a que Cristo sea visto.\n\nLa imagen más honesta que conozco la sugiere el mismo Jesús: el viento. No lo ves, pero ves lo que mueve. Un molino de viento, en lo alto de una colina, no produce el viento ni lo controla. Su único trabajo es abrir las aspas y estar donde sopla. Cuando el viento llega, las aspas giran, la piedra muele, y el pan llega a la mesa de un pueblo entero. El molino no se jacta del pan. Sabe que el viento hizo el trabajo.\n\nAsí es la vida llena del Espíritu: no un esfuerzo por parecer santo, sino una vela desplegada hacia donde sopla. Quien ha probado esa brisa no necesita que lo convenzan de su realidad. Pero tampoco debe presumirla. Se ofrece, se despliega, y deja que el Viento haga el resto.\n\nUna palabra, además, para quienes viven los dones con humildad y los ven operar en otros. El don de profecía, dice Pablo, edifica, exhorta y consuela. No es adivinación ni un truco para impresionar. Es una palabra a tiempo que viene de Dios y vuelve a Dios. Quien la recibe suele reconocerla porque no lo deja igual: le habla al corazón, no al orgullo. Y quien la da, si es honesto, la da con temblor, no con soberbia.\n\nEl don de sanidad, por su parte, se ejerce en una tensión que hay que aceptar: Dios sana, y a veces no sana. Hay milagros y hay muertes. Pablo pidió tres veces que le quitaran un aguijón, y la respuesta fue que le bastaba la gracia. Los que oran por los enfermos deben hacerlo con fe, sin prometer lo que no pueden garantizar. Y los que no son sanados no deben cargar con la culpa de una fe supuestamente deficiente. La fe no es una palanca que obliga a Dios; es una confianza que lo deja ser Dios.\n\nY el don de lenguas, que tanta controversia ha causado, es para mí, sobre todo, un don de oración. Cuando uno no tiene palabras, el Espíritu las pone. No siempre hay que entender; a veces basta con ofrecer la boca. Pablo mismo dice que da gracias a Dios porque habla en lenguas más que todos, y que, en la iglesia, prefiere cinco palabras con sentido que diez mil en una lengua desconocida. Todo en su lugar, y con orden.\n\nTe digo esto no para convencer a quien ve las cosas de otro modo. Te lo digo para que veas cómo vive uno que cree. A los que han sido heridos por abusos de los dones, y los ha habido, y graves, les pido que no confundan el abuso con el don. El billete falso demuestra que hay un billete verdadero."}, {"t": "Capítulo 26 · La oración: la puerta que está abierta", "x": "Pedid, y se os dará; buscad, y hallaréis; llamad, y se os abrirá.\n\n— Mateo 7:7\n\nHe dejado la oración para el final del camino, y no por desprecio, sino porque solo se la entiende cuando uno ya anduvo un trecho. Orar no es un ejercicio de los que están arriba. Es el aliento de los que están en el desierto.\n\nMuchos creen que orar es hablar con un Dios lejano, de quien no se sabe si escucha. Pero la Escritura presenta otra cosa: una conversación entre un Padre y sus hijos. Los discípulos vieron orar a Jesús y no le pidieron que les enseñara a predicar, ni a hacer milagros. Le pidieron que les enseñara a orar. Y Él les dio una oración tan corta que un niño la aprende, y tan honda que ninguno la agota.\n\nHay una alegoría que me ayuda con esto. Imagina una casa con muchas puertas cerradas, y un hombre que va de una en otra golpeando, cansado, sin saber cuál es la suya. Golpea la puerta del dinero, y nadie responde. Golpea la del prestigio, y le abren con una sonrisa vacía. Golpea la del placer, y le abren y le cierran. Sigue, y sigue, y al final de un pasillo largo ve una puerta pequeña, entornada. Ni siquiera tuvo que golpear: bastó que la empujara. Del otro lado había una mesa, una lámpara y un lugar vacío con su nombre. Nunca había estado cerrada. Era la única que le esperaba.\n\nOrar es empujar esa puerta. No exige palabras bonitas: el publicano de la parábola apenas dijo «ten compasión de mí, pecador» y volvió a casa justificado. A veces se ora con una frase, a veces con un suspiro, a veces con un silencio que Dios entiende mejor que cualquier discurso. Pablo dice que cuando no sabemos pedir como conviene, el Espíritu mismo intercede por nosotros con gemidos indecibles. Quien alguna vez no pudo orar, y se quedó solo con un nudo en la garganta, sabe que ese nudo también cuenta.\n\nNo toda oración se contesta como uno quiere. La de Jesús en Getsemaní, con sudor como gotas de sangre, no logró que pasara la copa. Pero fue contestada, y de qué manera: un ángel lo fortaleció y la copa se bebió hasta el fondo, y de esa copa salió la resurrección. A veces Dios no quita el desierto; hace brotar agua en él. Y para quien tiene sed, eso es más que una respuesta.\n\nSi nunca has orado, empieza por decir una sola cosa: aquí estoy. Y quédate un rato. Es todo lo que hace falta para empezar.\n\nSi la oración es una puerta, el Padrenuestro es el picaporte. Jesús nos lo dio como el modelo de toda oración, y es tan breve que cabe en el aliento de un niño y tan hondo que ningún teólogo lo ha agotado. Léelo despacio, como quien camina un sendero conocido. «Padre nuestro»: ya en las dos primeras palabras hay una teología entera. Padre, no «Señor de los ejércitos» ni «Causa primera». Y nuestro, no mío: no se ora solo. Quien dice «nuestro» recuerda que hay otros, que somos una familia.\n\n«Que estás en los cielos»: Él está arriba, es más grande que lo que vemos, y a la vez está cerca. Quien reza no habla al vacío.\n\n«Santificado sea tu nombre»: la primera petición no es por nosotros, sino por Él. Es un reorden: antes de pedir, honrar. Cuando uno empieza así, lo demás se coloca solo.\n\n«Venga tu reino, hágase tu voluntad»: no es una resignación, sino una entrega. Es decirle a Dios: lo tuyo primero, aunque me cueste.\n\n«El pan nuestro de cada día, dame hoy»: se pide lo necesario, no lo superfluo, y para hoy. Recuerda el maná en el desierto: nada para guardar, todo para vivir. Es una oración que cura de la ansiedad.\n\n«Perdónanos nuestras deudas, como también nosotros perdonamos»: ya hablamos del perdón, y aquí vuelve, atado a la oración como una cuerda a un ancla.\n\n«No nos metas en tentación, mas líbranos del mal»: el reconocimiento de nuestra debilidad. No nos creemos capaces; pedimos que Él nos guarde.\n\nY remata la antigua doxología: tuyo es el reino, el poder y la gloria. Terminar así es terminar mirando hacia arriba.\n\nOrar así, varias veces al día, despacio, deteniéndose en cada frase, puede ser una escuela para toda una vida. Y quien tenga poco tiempo, quien no sepa qué decir, quien esté demasiado cansado para otra cosa, puede usar sólo las dos primeras palabras. Padre nuestro. Y quedarse ahí. Es probable que el resto lo ponga Él."}, {"t": "Capítulo 27 · La fuente", "x": "Al que tenga sed, yo le daré gratuitamente de la fuente del agua de vida.\n\n— Apocalipsis 21:6\n\nHemos bajado hasta el fondo de la selva y hemos visto sus ratas, sus torres, sus jaulas y sus desiertos. Es hora de levantar la vista, porque la Biblia no termina en la selva. Termina en una ciudad. Y es lo que más sorprende a quien la lee entera: no hay un regreso al Edén, hay algo mejor. El que empezó en un huerto acaba en una ciudad con calles, puertas, muros y gente de toda lengua. Lo que se rompió se repara, y se repara más alto. En el centro de esa ciudad no hay un templo, porque el templo es Dios mismo. Y de su trono sale un río de agua de vida, claro como el cristal, y a ambos lados del río, el árbol de la vida, cuyas hojas son para la sanidad de las naciones. Fíjate: el árbol que el hombre perdió en el primer capítulo reaparece en el último, y esta vez nadie lo guarda con una espada.\n\nAquí debo decirte desde dónde leo. Soy reformado y futurista: creo que mucho de lo que dicen Daniel y Apocalipsis sobre los últimos tiempos tiene aún cumplimiento por delante. Esa es mi lectura. Otros hermanos, tan amantes de las Escrituras como yo, leen esos textos de otro modo, y no por eso dejan de ser mis hermanos. Pero hay cosas que ninguna escuela discute: que Cristo volverá, que habrá resurrección, que habrá juicio, y que Dios hará nuevas todas las cosas.\n\nHay una fuente. Desde el principio la hubo, y la hay hasta el final. Dios se queja por boca de Jeremías de que su pueblo lo ha dejado a Él, manantial de aguas vivas, para cavarse cisternas rotas que no retienen agua. Jesús, junto a un pozo, le dice a una mujer cansada que quien beba del agua que Él da no volverá a tener sed. En el último día de una gran fiesta se pone de pie y grita: el que tenga sed, venga a mí y beba. Y en la última página de la Biblia la invitación sigue abierta: el que quiera, tome del agua de la vida gratuitamente. Gratuitamente. Esa es la palabra que sostiene todo este libro. No hay entrada que pagar, ni credencial que mostrar, ni pasado que borrar primero. Hay un manantial, y hay sed, y no hace falta más. El poeta de la selva oscura descubre al final que lo que movía el sol y las demás estrellas era el amor. No lo habrá dicho mejor ningún teólogo. Y no es una idea: es la Persona de la que hemos venido hablando.\n\nRecuerda al viajero del preludio, el del cántaro vacío. Cuando llegó a la orilla no hizo nada heroico. No pagó, no mereció, no se purificó primero. Se arrodilló y bebió. Y mientras bebía, comprendió que el desierto entero había sido el camino más largo hacia una puerta que siempre estuvo abierta.\n\nY ahora, antes de cerrar, quiero hacerte una pregunta que no es retórica. ¿Dónde estás tú en este camino?\n\nQuizá estés todavía en el desierto, con el cántaro vacío y los labios secos. Si es así, no tengas vergüenza. El desierto no es un castigo; es una etapa. Mira a tu alrededor: hay rastros de otros viajeros que pasaron antes, y todos llegaron. Sigue caminando, aunque sea despacio. Y cuando oigas, lejos, un rumor de agua, no creas que es un espejismo. Camina hacia él.\n\nQuizá estés al pie de una duna, a punto de rendirte. Entonces te pido solo una cosa: sube. Un paso más. Desde arriba se ve lo que desde abajo no se puede ver.\n\nQuizá hayas llegado ya a la orilla y bebido, y tengas sed otra vez. Eso también es normal. La fuente no se agota, y la invitación a beber vale para hoy y para mañana. Jesús dijo que de quien beba de Él correrán ríos de agua viva. No dijo que la sed no volvería: dijo que ya no sería la misma. Sería una sed que sabe adónde ir.\n\nY quizá, por último, seas de los que, habiendo bebido, ven pasar a otros con sed y se preguntan qué hacer. Haz lo que hizo la mujer del pozo: deja tu cántaro y ve a decirles. No necesitas ser un erudito. Basta con que digas: «Ven y mira». Eso fue lo que dijo Felipe a Natanael, y es lo único que hace falta decir.\n\nHay una fuente. Ha estado siempre. Y está ahí, de balde, para ti."}, {"t": "Epílogo: La lámpara sigue encendida", "x": "Hemos recorrido, en poco espacio, un camino largo: del desierto a la fuente, pasando por el jardín y por la grieta; de la selva oscura a la ciudad, pasando por el duelo. Hemos hablado del corazón y de las ratas, de Babel y de la libertad, de los niños, de los jóvenes y de los ancianos, de los cuatro amores y de la fe, del perdón, del ruido y del silencio, de la oración. No he pretendido agotar nada. Una charla de sobremesa no agota un tema: lo abre.\n\nVivimos en un mundo de ciegos, y no somos la primera sociedad que lo es. A veces hace más el que quiere que el que puede. Yo soy de los que creen que un solo eslabón puede comenzar una cadena entera. Un libro puede cambiar un hilo de pensamientos, o romperlo, y de ahí cambiar una vida, y de ahí una casa, y de ahí un barrio.\n\nSi has llegado hasta aquí sin creer, no te pido que creas. Te pido que leas el cuento completo antes de decir que es un cuento. Si has llegado creyendo, te pido que no creas por inercia, sino por revelación, y que vuelvas a mirar con ojos nuevos lo que ya sabías. Y si has llegado roto, quiero que sepas que la puerta está abierta como estás: sucio, escupido, adolorido, entre polvo y tierra. Siempre has sido polvo, y Dios lo sabe, y así y todo abrió. Es de noche, y es un martes cualquiera. El duelo se transita. El desierto se cruza. Cada uno baja en su estación, y a cada uno le toca caminar por el terreno que le quedó. Mientras haya luz, hay que seguir contando lo que se vio.\n\nHay una mesa, hay pan, y hay un lugar con tu nombre. La fuente no se agota, y tú puedes volver a beber cuantas veces tengas sed.\n\nLa lámpara sigue encendida.\n\nOscar Pellegrino"}]}, {"id": "huerto", "t": {"es": "Debajo del sol, dentro del huerto", "en": "Under the Sun, Inside the Garden", "ko": "해 아래서, 동산 안에서"}, "d": {"es": "Vapor y fuego: una teología del deseo humano. Meditaciones sobre la vanidad que cansa y el amor que permanece.", "en": "Vapor and fire: a theology of human desire. Meditations on the vanity that wearies and the love that remains.", "ko": "수증기와 불: 인간 욕망의 신학. 지치게 하는 헛됨과 변치 않는 사랑에 대한 묵상."}, "ch": [{"t": "Nota del autor y prólogo", "x": "Nota del autor Este libro nació de una pregunta que no me atreví a formular en voz alta durante años: ¿por qué el hombre que más sabe suele ser el más inquieto, y el hombre que más ama suele ser el más sereno? Qohélet, el Predicador, recorrió el primer camino hasta el fondo y volvió con las manos vacías. La sulamita del Cantar recorrió el segundo y volvió transformada. Ambos libros están en el mismo canon, escritos —según la tradición— por el mismo rey. Uno mide la distancia entre el hombre y el sentido cuando busca debajo del sol. El otro mide la distancia entre el alma y su Amado cuando busca dentro del huerto.\n\nNo escribo como quien ya llegó. Escribo como quien ha estado en ambos lugares el mismo día, a veces la misma hora: agotado por el vapor y, un instante después, sorprendido por el fuego. Este no es un comentario técnico, aunque de tanto en tanto asome el hebreo detrás de una palabra, porque las palabras originales todavía tienen la costumbre de decir más de lo que decimos nosotros. Es, sobre todo, una conversación larga con cualquiera que sospeche que la vida tiene que ser algo más que lo que cabe debajo del sol, y que no sabe todavía que esa sospecha ya es una forma de fe.\n\nEscribo desde el Aposento Alto: no un lugar geográfico, sino esa habitación interior donde los discípulos esperaron una promesa que no podían fabricar por su cuenta. Ahí es donde este libro quiere llevarte.\n\nPrólogo Hay una palabra hebrea que aparece más de treinta veces en un solo libro de la Biblia y que la mayoría de las traducciones resuelve con un término demasiado manso: vanidad. La palabra es hével, y su significado original no es moral sino físico. Hével es el vaho que sale de la boca en una mañana fría, el humo que se deshace apenas se levanta, el aliento que no se puede guardar en un puño. Qohélet no está diciendo que la vida sea inmoral ni que no tenga valor. Está diciendo algo más incómodo: que la vida, medida únicamente por lo que ocurre debajo del sol, se evapora entre los dedos aunque uno la viva con toda la intensidad de la que es capaz.\n\nEse es el diagnóstico. Y es un diagnóstico honesto, porque no viene de un fracasado ni de un resentido. Viene de un hombre que probó cada salida disponible: la sabiduría, el placer, la construcción, la acumulación, el legado. Las agotó todas y todas le devolvieron el mismo eco: viento que se persigue y no se atrapa.\n\nPero el mismo canon que contiene ese diagnóstico contiene también, unos rollos más adelante en el orden hebreo, un libro que empieza de un modo completamente distinto. No con una queja sino con un anhelo: que me bese con los besos de su boca. El Cantar de los Cantares no niega el vacío que describe Qohélet. Lo presupone. Solo que en lugar de examinar el vacío desde afuera, entra en él desde otra puerta: la del deseo que\n\nencuentra, finalmente, un objeto capaz de sostenerlo.\n\nEste libro camina esos dos senderos a propósito, uno después del otro, para que el lector llegue al segundo con el primero todavía fresco en la memoria. Porque la promesa de intimidad del Cantar solo se escucha entera cuando antes se ha sentido, de verdad, el peso del vapor. Quien no ha llegado hasta el fondo de la insatisfacción rara vez reconoce, cuando por fin aparece, la voz que lo llama por su nombre desde el otro lado del muro.\n\nSi eres joven y todavía tienes toda la energía para intentarlo todo, este libro te va a ahorrar algunos años de vueltas. Si ya llevas un tiempo intentándolo, este libro no te va a sorprender con el diagnóstico, pero espero que sí te sorprenda con la salida. Los dos caminos —el del sol y el del huerto— no son opcionales el uno respecto del otro. Son el mismo camino visto en dos momentos distintos de la misma vida.\n\nÍndice Nota del autor Prólogo\n\nPrimera parte — El vapor\n\n1. El hombre debajo del sol 2. La rueda que no se detiene 3. El precio de saber 4. La fiesta que no sacia 5. Lo que construimos y no retenemos 6. El reloj que no obedecemos 7. Cuando la balanza está torcida 8. Solos no fuimos hechos\n\nSegunda parte — El huerto\n\n9. El primer beso 10. La noche en que no lo hallé 11. Toda tú eres hermosa 12. Las excusas del alma cómoda 13. Fuerte como la muerte 14. La hermana pequeña\n\nTercera parte — El aposento alto\n\n15. La arquitectura del anhelo 16. Carta a quien todavía está probando puertas 17. Carta a quien ya probó casi todas 18. Epílogo: Recordar en el aposento alto Glosario de términos hebreos\n\nPRIMERA PARTE\n\nEL VAPOR «Vanidad de vanidades, dijo el Predicador; todo es vanidad.»\n\nDebajo del sol, dentro del huerto"}, {"t": "Capítulo 1 · El hombre debajo del sol", "x": "Empecemos por el título que Qohélet le puso a su propia búsqueda, porque ahí está ya la clave de todo lo que sigue: tajat hashámesh, debajo del sol. No es una frase decorativa. Aparece unas veintinueve veces y funciona como el marco de toda la investigación. Es la promesa de que, durante un rato, el Predicador va a dejar fuera del análisis cualquier referencia a lo que está por encima del sol. Va a mirar la existencia humana exactamente como la miraría alguien que no cree en nada más que en lo que puede pesar, contar y enterrar.\n\nEs un experimento intelectual valiente, y por eso el libro sigue siendo tan actual. Cualquier persona honesta que decida vivir así durante suficiente tiempo llega, tarde o temprano, a la misma conclusión que Qohélet: que el sol sale y se pone y vuelve a salir sin que a nadie parezca importarle demasiado lo que uno hizo ayer. El viento gira y vuelve a girar sobre sus mismos circuitos. Los ríos desembocan en el mar y el mar nunca se llena. La naturaleza no está en huelga contra el hombre; simplemente sigue su curso, indiferente a nuestros logros, y eso a Qohélet le resulta insoportable. No porque odie la naturaleza, sino porque esperaba que el mundo llevara la cuenta de sus esfuerzos, y descubre que no lleva ninguna.\n\nHay una palabra que se repite junto al vapor y que conviene no pasar por alto: yegiá, el trabajo que desgasta, el esfuerzo que\n\nEl hombre debajo del sol\n\ncuesta el cuerpo y el ánimo. No es la palabra normal para trabajo; es la palabra para el trabajo que te deja exhausto. Qohélet no está describiendo el descanso del sábado del que habla el resto de la Escritura. Está describiendo la fatiga de quien corre en una cinta que no avanza, y lo hace, además, sabiendo que nadie se acordará del recorrido.\n\nAquí conviene detenerse en algo que casi nunca se dice en voz alta: el libro de Eclesiastés no es un libro para pesimistas resignados. Es un libro para optimistas exhaustos, para gente que todavía cree que algo, en algún lugar, tiene que llenar el vacío, y que sigue probando puertas aunque cada una se cierre en la cara. El pesimista deja de intentarlo. Qohélet no deja de intentarlo hasta el capítulo dos. Esa es la diferencia entre la desesperanza y la honestidad: la desesperanza se cruza de brazos; la honestidad sigue tocando puertas hasta comprobar, con evidencia y no con sospecha, que ninguna de ellas es la correcta.\n\nHay una intuición muy antigua, presente en distintas tradiciones filosóficas antes y después de Qohélet, que sostiene que si un deseo existe en la naturaleza, en algún lugar existe también aquello capaz de satisfacerlo. El hambre presupone la comida; la sed presupone el agua; el cansancio presupone el descanso. Ningún deseo natural aparece sin su correspondiente objeto real. Y sin embargo hay un deseo —el de que la vida signifique algo más allá de la cinta y el vapor— que ningún objeto debajo del sol logra saciar. La pregunta que ese hecho deja flotando en el aire, y que Qohélet todavía no responde en el primer capítulo, es simple e incómoda: si nada debajo del sol\n\nDebajo del sol, dentro del huerto\n\nsatisface ese deseo, ¿será que el objeto correspondiente está, sencillamente, en otro lugar?\n\nGuardemos esa pregunta. Este primer capítulo solo quería dejarla planteada con la misma honestidad brutal con la que la planteó Qohélet, sin apurar la respuesta, sin consuelo prematuro. El resto del libro va a caminar, junto con él, cada uno de los callejones donde probó buscarla, antes de asomarse, en la segunda parte, al huerto donde finalmente la encontró.\n\nEl hombre debajo del sol"}, {"t": "Capítulo 2 · La rueda que no se detiene", "x": "Hay una forma de desesperación que no grita: simplemente observa. Es la que ocupa los versículos donde Qohélet describe el sol saliendo apresurado hacia el lugar de donde volverá a salir, el viento dando vueltas sobre sus propios giros, los ríos corriendo hacia un mar que nunca se colma. No hay drama en la descripción. Hay algo peor: precisión.\n\nLo que Qohélet está mirando es un sistema cerrado. Todo entra, todo sale, nada se acumula, nada progresa en un sentido final. Y lo perturbador no es el movimiento en sí, sino que ese mismo patrón, cuando se traslada a la historia humana, deja de sonar poético y empieza a sonar amenazante: no hay memoria de lo primero, ni tampoco de lo que después vendrá habrá memoria en los que serán después. Las generaciones se suceden como las olas: cada una cree ser la definitiva mientras rompe, y cada una es olvidada apenas la siguiente ocupa su lugar.\n\nAquí es donde muchos lectores modernos, formados en una cultura que promete progreso indefinido, sienten una resistencia instintiva. Nos han enseñado que la historia avanza, que cada generación construye sobre la anterior, que el conocimiento se acumula sin techo. Y en cierto nivel técnico eso es verdad: sabemos hacer cosas que Qohélet no soñó. Pero él no estaba hablando de tecnología. Estaba hablando de la memoria y del sentido, dos cosas que no obedecen a la misma curva de\n\nDebajo del sol, dentro del huerto\n\ncrecimiento que la técnica. Se puede tener el teléfono más avanzado del mundo y, aun así, sentir exactamente el mismo vacío ontológico que sintió un pastor mesopotámico hace tres mil años frente a un rebaño. El progreso material no ha resuelto el problema que Qohélet identificó; en algunos aspectos lo ha vuelto más visible, porque ahora tenemos más tiempo libre para notarlo.\n\nHay algo curioso en cómo funciona la nostalgia colectiva: cada generación tiende a idealizar la anterior, convencida de que antes las cosas tenían más peso, más raíz, más permanencia. Y sin embargo, si uno mira suficientemente atrás, descubre que la generación idealizada sentía exactamente la misma nostalgia por la que la precedió. Es un espejo que se refleja en otro espejo sin encontrar nunca una imagen final. Ese fenómeno, tan documentado en la psicología social contemporánea, ya estaba diagnosticado en este capítulo: no hay novedad definitiva; lo que hoy llamamos revolucionario ya existió, con otro nombre, en los siglos que nos precedieron, y de eso tampoco quedó memoria completa.\n\n¿Qué hacer, entonces, con un mundo que gira sin detenerse y con una historia que olvida sin remedio? La respuesta que este libro va a defender, y que se hará explícita recién en la tercera parte, no consiste en negar el círculo, sino en identificar que el círculo mismo apunta hacia afuera de sí. Ningún sistema cerrado explica por qué percibimos su clausura como una tragedia. Una rueda no sabe que gira; solo un observador situado, de algún modo, fuera de la rueda puede describirla como repetitiva. El\n\nLa rueda que no se detiene\n\nhecho de que el hombre sea capaz de aburrirse del ciclo natural —cosa que ningún otro animal parece experimentar— es en sí mismo un dato curioso, casi una fisura en el sistema. Estamos hechos, aparentemente, para algo que no es circular. Y esa incomodidad frente al círculo, lejos de ser un defecto de fabricación, podría ser la primera pista seria de que no fuimos fabricados solo para él.\n\nDebajo del sol, dentro del huerto"}, {"t": "Capítulo 3 · El precio de saber", "x": "Si algún lector todavía conserva la ilusión de que basta con pensar mejor para vivir mejor, este capítulo del libro se encarga de desarmarla con metódica precisión. Qohélet entrega su corazón a inquirir y a explorar con sabiduría todo lo que ocurre bajo el cielo, y usa para eso un verbo intenso, darash, que no describe una lectura casual sino una investigación obsesiva, del tipo que hoy asociaríamos con un investigador que no duerme hasta resolver el problema. No hay pereza intelectual en este hombre. Y sin embargo su conclusión, después de tanto esfuerzo, es que todo aquello resultó ser también vapor y persecución del viento.\n\nLa frase que usa para describir su fracaso merece atención: re'ut rúaj, que algunas versiones traducen como aflicción de espíritu y que literalmente significa algo más cercano a pastorear el viento. Imaginen a un pastor intentando arrear una manada de viento con su cayado. El viento no se
